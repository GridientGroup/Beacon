<script>
/* bundle 145: Beacon tells this map which part of it is on screen, so its
   pop-up cards open in the middle of what you can see, not the middle of the
   whole (taller) map frame. */
window.addEventListener('message', function (e) {
  var d = e && e.data;
  if (!d || d.type !== 'beacon-viewport') return;
  var r = document.documentElement.style;
  r.setProperty('--vp-top', Math.max(0, d.top) + 'px');
  r.setProperty('--vp-h', Math.max(240, d.height) + 'px');
});
</script>

    /* ============================================================
       TopoJSON → GeoJSON (minimal inline decoder)
       ============================================================ */
    function topoToGeo(topo, objectName) {
      const obj = topo.objects[objectName];
      if (!obj) return null;
      const t = topo.transform || { scale: [1, 1], translate: [0, 0] };
      const arcs = topo.arcs.map(arc => {
        let x = 0, y = 0;
        return arc.map(([dx, dy]) => {
          x += dx; y += dy;
          return [x * t.scale[0] + t.translate[0], y * t.scale[1] + t.translate[1]];
        });
      });
      const arcCoords = (idx) => idx < 0 ? arcs[~idx].slice().reverse() : arcs[idx];
      const ring = (indices) => {
        const out = [];
        for (let i = 0; i < indices.length; i++) {
          let pts = arcCoords(indices[i]);
          if (i > 0) pts = pts.slice(1);
          for (const p of pts) out.push(p);
        }
        return out;
      };
      const coords = (g) => {
        if (g.type === 'Polygon') return g.arcs.map(ring);
        if (g.type === 'MultiPolygon') return g.arcs.map(p => p.map(ring));
        return null;
      };
      return {
        type: 'FeatureCollection',
        features: obj.geometries.map(g => ({
          type: 'Feature',
          id: g.id,
          properties: g.properties || {},
          geometry: { type: g.type, coordinates: coords(g) },
        })),
      };
    }

      ['WY','Wyoming',42.756,-107.3025],

    const STATE_BY_CODE = Object.fromEntries(STATE_INFO.map(s => [s[0], s]));
    const STATE_BY_NAME = Object.fromEntries(STATE_INFO.map(s => [s[1].toLowerCase(), s]));

    const norm = s => (s || '').trim().toLowerCase().replace(/\bst\.\s*/g, 'saint ').replace(/\s+/g, ' ');

    function resolveState(input) {
      if (!input) return null;
      const k = input.trim().toUpperCase();
      if (STATE_BY_CODE[k]) return STATE_BY_CODE[k];
      const byName = STATE_BY_NAME[input.trim().toLowerCase()];
      return byName || null;
    }

    function searchCities(query, limit = 8) {
      if (!query) return [];
      const q = query.trim();
      let cityPart = q, statePart = '';
      if (q.includes(',')) {
        const [a, b] = q.split(',').map(s => s.trim());
        cityPart = a; statePart = b || '';
      } else {
        const parts = q.split(/\s+/);
        if (parts.length >= 2) {
          const last = parts[parts.length - 1];
          if (resolveState(last) || resolveState(parts.slice(-2).join(' '))) {
            statePart = resolveState(parts.slice(-2).join(' ')) ? parts.slice(-2).join(' ') : last;
            cityPart = q.slice(0, q.length - statePart.length).trim();
          }
        }
      }
      const cityN = norm(cityPart);
      const stateInfo = statePart ? resolveState(statePart) : null;
      const stateCode = stateInfo ? stateInfo[0] : null;
      const results = [];
      for (const [city, code, lat, lng] of CITIES) {
        if (stateCode && code !== stateCode) continue;
        const cn = norm(city);
        if (cn.startsWith(cityN) || cn.includes(cityN)) {
          results.push({ city, state: code, lat, lng, score: cn === cityN ? 0 : (cn.startsWith(cityN) ? 1 : 2) });
          if (results.length > 60) break;
        }
      }
      results.sort((a, b) => a.score - b.score);
      return results.slice(0, limit);
    }

    function geocode(query) {
      const r = searchCities(query, 1);
      if (r.length) return { ...r[0], approximate: false };
      const parts = query.split(',').map(s => s.trim());
      for (const p of parts.reverse()) {
        const s = resolveState(p);
        if (s) return { city: parts.join(', '), state: s[0], lat: s[2], lng: s[3], approximate: true };
      }
      return null;
    }

    /* ============================================================
       US MAP
       ============================================================ */
    function USMap({ assets, hoveredId, setHoveredId, selectedId, setSelectedId, selectedClusterKey, setSelectedClusterKey, matchedIds }) {
      const [geo, setGeo] = useState(null);
      const [size, setSize] = useState({ w: 1000, h: 600 });
      const [status, setStatus] = useState('loading'); // loading | ok | fallback
      const wrapRef = useRef(null);

      useEffect(() => {
        let cancelled = false;
        // Try jsdelivr first (most reliable CORS), then unpkg, then a github mirror
        const tryFetch = async () => {
          const sources = [
            { url: 'https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json', topo: true },
            { url: 'https://unpkg.com/us-atlas@3/states-10m.json',           topo: true },
            { url: 'https://cdn.jsdelivr.net/npm/us-atlas@2/us/states-10m.json', topo: true },
          ];
          for (const src of sources) {
            try {
              const r = await fetch(src.url);
              if (!r.ok) continue;
              const data = await r.json();
              if (cancelled) return;
              if (src.topo) {
                const geo = topoToGeo(data, 'states');
                if (geo && geo.features.length > 5) {
                  setGeo(geo); setStatus('ok'); return;
                }
              } else {
                setGeo(data); setStatus('ok'); return;
              }
            } catch (e) { /* next */ }
          }
          if (!cancelled) setStatus('fallback');
        };
        tryFetch();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (!wrapRef.current) return;
        const ro = new ResizeObserver(entries => {
          const e = entries[0];
          if (!e) return;
          const w = Math.max(400, e.contentRect.width);
          setSize({ w, h: Math.round(w * 0.6) });
        });
        ro.observe(wrapRef.current);
        return () => ro.disconnect();
      }, []);

      const projection = useMemo(() => {
        return d3.geoAlbersUsa().scale(size.w * 1.25).translate([size.w / 2, size.h / 2]);
      }, [size.w, size.h]);
      const pathGen = useMemo(() => d3.geoPath(projection), [projection]);

      const pinPositions = useMemo(() => {
        return assets.map(a => {
          const p = projection([a.lng, a.lat]);
          return p ? { ...a, x: p[0], y: p[1] } : null;
        }).filter(Boolean);
      }, [assets, projection]);

      // group pins by city+state into clusters
      const clusters = useMemo(() => {
        const TYPE_PRIORITY = { employee: 0, partner: 1, contractor: 2 };
        const map = new Map();
        for (const p of pinPositions) {
          const key = `${p.city}|${p.state}`;
          if (!map.has(key)) {
            map.set(key, { key, city: p.city, state: p.state, x: p.x, y: p.y, assets: [] });
          }
          map.get(key).assets.push(p);
        }
        const out = [];
        for (const cl of map.values()) {
          const counts = {};
          for (const a of cl.assets) counts[a.type] = (counts[a.type] || 0) + 1;
          cl.dominantType = Object.entries(counts)
            .sort((a, b) => b[1] - a[1] || TYPE_PRIORITY[a[0]] - TYPE_PRIORITY[b[0]])[0][0];
          cl.typeCounts = counts;
          cl.isMixed = Object.keys(counts).length > 1;
          out.push(cl);
        }
        return out;
      }, [pinPositions]);

      const hoveredCluster = useMemo(() => {
        if (!hoveredId) return null;
        return clusters.find(cl => cl.assets.some(a => a.id === hoveredId)) || null;
      }, [hoveredId, clusters]);

      // fallback: draw simple circles at state centroids if no geo data loaded
      const fallbackStates = useMemo(() => {
        if (status !== 'fallback') return null;
        return STATE_INFO.map(([code, name, lat, lng]) => {
          const p = projection([lng, lat]);
          return p ? { code, name, x: p[0], y: p[1] } : null;
        }).filter(Boolean);
      }, [status, projection]);

      return (
        <div ref={wrapRef} className="relative w-full" style={{ minHeight: 380 }}>
          <div className="absolute inset-0 rounded-2xl pointer-events-none"
            style={{
              background: `radial-gradient(circle at 30% 20%, #0a1d36 0%, #050b16 70%)`,
              boxShadow: `inset 0 0 120px rgba(0,0,0,0.55)`,
            }} />
          <div className="absolute inset-0 rounded-2xl pointer-events-none"
            style={{
              opacity: 0.16,
              backgroundImage:
                `linear-gradient(${C.borderSoft} 1px, transparent 1px),
                 linear-gradient(90deg, ${C.borderSoft} 1px, transparent 1px)`,
              backgroundSize: '32px 32px',
            }} />

          <svg viewBox={`0 0 ${size.w} ${size.h}`} width="100%" height="100%"
            className="relative block"
            style={{ filter: 'drop-shadow(0 0 60px rgba(0, 212, 255, 0.06))' }}>
            <defs>
              <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#1d3a64" />
                <stop offset="100%" stopColor="#0f1e36" />
              </linearGradient>
              <filter id="pinGlow" x="-200%" y="-200%" width="500%" height="500%">
                <feGaussianBlur stdDeviation="3.5" />
              </filter>
              <filter id="strongGlow" x="-200%" y="-200%" width="500%" height="500%">
                <feGaussianBlur stdDeviation="6" />
              </filter>
            </defs>

            {/* primary: real state outlines */}
            {status === 'ok' && geo && geo.features.map((f, i) => (
              <path key={i} d={pathGen(f) || ''}
                fill="url(#landGrad)" stroke={C.landStroke} strokeWidth={0.8}
                style={{ transition: 'fill 200ms ease' }} />
            ))}

            {/* fallback: state hex/dots at centroids */}
            {status === 'fallback' && fallbackStates && fallbackStates.map((s) => (
              <g key={s.code}>
                <circle cx={s.x} cy={s.y} r={size.w * 0.022} fill="url(#landGrad)" stroke={C.landStroke} strokeWidth={0.8} />
                <text x={s.x} y={s.y + 4} textAnchor="middle"
                  fill={C.textMuted} fontFamily="'IBM Plex Mono', monospace"
                  fontSize={Math.max(10, size.w * 0.011)} fontWeight="600" letterSpacing="0.5">
                  {s.code}
                </text>
              </g>
            ))}

            {status === 'loading' && (
              <text x={size.w / 2} y={size.h / 2} textAnchor="middle"
                fill={C.textDim} fontFamily="'IBM Plex Mono', monospace" fontSize="12" letterSpacing="2">
                LOADING TERRITORY…
              </text>
            )}

            {/* connector lines from geographic center to each cluster */}
            {clusters.length > 0 && (() => {
              const cx = projection([-98.5795, 39.8283]);
              if (!cx) return null;
              return (
                <g opacity="0.25">
                  {clusters.map(cl => (
                    <line key={`l${cl.key}`} x1={cx[0]} y1={cx[1]} x2={cl.x} y2={cl.y}
                      stroke={TYPE_META[cl.dominantType].color} strokeWidth={0.6} strokeDasharray="2 4" />
                  ))}
                  <circle cx={cx[0]} cy={cx[1]} r={3} fill={C.text} opacity={0.5} />
                </g>
              );
            })()}

            {/* CLUSTER PINS — size scales with asset count, count shown for n>1 */}
            {clusters.map((cl) => {
              const n = cl.assets.length;
              const meta = TYPE_META[cl.dominantType];
              const isHover = cl.assets.some(a => a.id === hoveredId);
              const isSelected =
                cl.assets.some(a => a.id === selectedId) ||
                selectedClusterKey === cl.key;
              // BEACON: pin "lights up" when ANY of its assets match the search
              const hasSearch = matchedIds && matchedIds.size > 0;
              const isMatched = hasSearch && cl.assets.some(a => matchedIds.has(a.id));
              const active = isHover || isSelected || isMatched;
              const dimmed = hasSearch && !isMatched;

              // size grows with asset count, capped
              const crispR = 6 + Math.min(Math.sqrt(n - 1) * 2.5, 10);
              const outerR = crispR * 1.4;
              const haloR  = crispR * 1.85;
              const ringR  = crispR * 2.3;
              const fontSize = Math.max(10, Math.min(Math.round(crispR * 1.25), 16));

              const onClickPin = (e) => {
                e.stopPropagation();
                if (n === 1) setSelectedId(cl.assets[0].id);
                else setSelectedClusterKey(cl.key);
              };
              // hover the first asset in the cluster (drives the tooltip / list highlight)
              const onEnter = () => setHoveredId(cl.assets[0].id);
              const onLeave = () => setHoveredId(null);

              return (
                <g key={cl.key}
                  transform={`translate(${cl.x},${cl.y})`}
                  style={{ cursor: 'pointer', opacity: dimmed ? 0.22 : 1, transition: 'opacity 200ms ease' }}
                  onMouseEnter={onEnter}
                  onMouseLeave={onLeave}
                  onClick={onClickPin}>

                  {/* search-match pulse ring */}
                  {isMatched && !isSelected && (
                    <circle r={ringR + 6} fill="none" stroke={meta.color} strokeWidth={1.5}
                      opacity={0.55} />
                  )}
                  {/* selection ring */}
                  {isSelected && (
                    <circle r={ringR + 4} fill="none" stroke={meta.color} strokeWidth={1.5}
                      opacity={0.7} strokeDasharray="3 3" />
                  )}
                  {/* outer ring */}
                  <circle r={active ? ringR + 2 : ringR} fill={meta.color} opacity={0.18} filter="url(#strongGlow)" />
                  {/* halo */}
                  <circle r={active ? haloR + 2 : haloR} fill={meta.color} opacity={0.32} filter="url(#strongGlow)" />
                  {/* outer pin glow */}
                  <circle r={active ? outerR + 2 : outerR} fill={meta.color} filter="url(#pinGlow)" opacity={0.9} />
                  {/* crisp pin */}
                  <circle r={active ? crispR + 1.5 : crispR} fill={meta.color} stroke="white" strokeWidth={1.5} />

                  {/* center: count if cluster, white dot if single */}
                  {n > 1 ? (
                    <text x={0} y={0} textAnchor="middle" dominantBaseline="central"
                      fill="white" fontFamily="'IBM Plex Mono', monospace" fontWeight="700"
                      fontSize={fontSize}
                      style={{ pointerEvents: 'none', userSelect: 'none' }}>
                      {n}
                    </text>
                  ) : (
                    <circle r={(active ? crispR + 1.5 : crispR) * 0.4} fill="white" />
                  )}
                </g>
              );
            })}

            {/* hover tooltip */}
            {hoveredCluster && (() => {
              const meta = TYPE_META[hoveredCluster.dominantType];
              const n = hoveredCluster.assets.length;
              const isCluster = n > 1;
              const w = 230, h = 76;
              const tx = Math.min(Math.max(hoveredCluster.x + 16, 10), size.w - w - 10);
              const ty = Math.max(hoveredCluster.y - h - 12, 10);
              const title = isCluster
                ? `${hoveredCluster.city}, ${hoveredCluster.state}`
                : (hoveredCluster.assets[0].name || meta.label);
              const sub = isCluster
                ? `${n} ASSETS · CLICK TO VIEW`
                : meta.label.toUpperCase();
              const detail = isCluster
                ? hoveredCluster.assets.map(a => TYPE_META[a.type].label).join(' · ')
                : `${hoveredCluster.assets[0].city}, ${hoveredCluster.assets[0].state}`;
              return (
                <g transform={`translate(${tx},${ty})`} style={{ pointerEvents: 'none' }}>
                  <rect width={w} height={h} rx={10} fill={C.panelSolid} stroke={meta.color} strokeWidth={1.2} />
                  <rect x={0} y={0} width={4} height={h} fill={meta.color} rx={2} />
                  <text x={14} y={24} fill={C.text} fontFamily="'IBM Plex Sans', sans-serif" fontSize="14" fontWeight="600">
                    {title}
                  </text>
                  <text x={14} y={44} fill={meta.color} fontFamily="'IBM Plex Mono', monospace" fontSize="10" letterSpacing="2" fontWeight="600">
                    {sub}
                  </text>
                  <text x={14} y={62} fill={C.textMuted} fontFamily="'IBM Plex Sans', sans-serif" fontSize="11">
                    {detail.length > 32 ? detail.slice(0, 32) + '…' : detail}
                  </text>
                </g>
              );
            })()}
          </svg>

          {/* corner overlay labels */}
          <div className="absolute top-3 left-4 flex items-center gap-2 pointer-events-none"
            style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
            <span style={{ color: C.accent, fontSize: 10, letterSpacing: 3 }}>● LIVE</span>
            <span style={{ color: C.textDim, fontSize: 10, letterSpacing: 3 }}>NETWORK MAP</span>
            {status === 'fallback' && (
              <span style={{ color: C.textMuted, fontSize: 9, letterSpacing: 2, marginLeft: 8 }}>· schematic mode</span>
            )}
          </div>
          <div className="absolute top-3 right-4 pointer-events-none text-right"
            style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
            <div style={{ color: C.textDim, fontSize: 9, letterSpacing: 2 }}>ASSETS DEPLOYED</div>
            <div style={{ color: C.text, fontSize: 24, fontWeight: 600, letterSpacing: 1, lineHeight: 1 }}>
              {String(assets.length).padStart(3, '0')}
            </div>
          </div>
        </div>
      );
    }

                fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14 }}
              onFocus={(e) => e.target.style.borderColor = C.accent}
              onBlur={(e) => e.target.style.borderColor = C.border} />
          </div>

          <div className="relative">
            <label style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: 2, color: C.textDim }}>LOCATION</label>
            <div className="relative mt-1">
              <span style={{ position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)', color: C.textDim, pointerEvents: 'none' }}>
                <IcSearch size={14} />
              </span>
              <input
                value={location}
                onChange={(e) => { setLocation(e.target.value); setError(''); setShowSugg(true); }}
                onFocus={() => setShowSugg(true)}
                onBlur={() => setTimeout(() => setShowSugg(false), 150)}
                onKeyDown={(e) => {
                  if (showSugg && suggestions.length) {
                    if (e.key === 'ArrowDown') { e.preventDefault(); setHighlight(h => Math.min(h + 1, suggestions.length - 1)); }
                    else if (e.key === 'ArrowUp') { e.preventDefault(); setHighlight(h => Math.max(h - 1, 0)); }
                    else if (e.key === 'Enter') { e.preventDefault(); if (suggestions[highlight]) pick(suggestions[highlight]); else submit(); }
                    else if (e.key === 'Escape') setShowSugg(false);
                  } else if (e.key === 'Enter') submit();
                }}
                placeholder='City, ST  (e.g. "Tampa, FL")'
                className="w-full pl-9 pr-3 py-2.5 rounded-lg outline-none transition-all"
                style={{ background: 'rgba(255,255,255,0.03)', border: `1px solid ${C.border}`, color: C.text,
                  fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14 }}
                onFocusCapture={(e) => e.target.style.borderColor = C.accent}
                onBlurCapture={(e) => e.target.style.borderColor = C.border} />
            </div>

            {showSugg && suggestions.length > 0 && (
              <div className="absolute left-0 right-0 z-20 mt-1 rounded-lg overflow-hidden shadow-2xl"
                style={{ background: C.panelSolid, border: `1px solid ${C.border}` }}>
                {suggestions.map((s, i) => (
                  <button key={`${s.city}-${s.state}-${i}`}
                    onMouseDown={(e) => { e.preventDefault(); pick(s); }}
                    onMouseEnter={() => setHighlight(i)}
                    className="w-full text-left px-3 py-2 flex items-center justify-between transition-colors"
                    style={{
                      background: highlight === i ? C.panelStrong : 'transparent',
                      color: C.text, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13,
                      borderBottom: i < suggestions.length - 1 ? `1px solid ${C.border}` : 'none',
                    }}>
                    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                      <span style={{ color: C.accent }}><IcMapPin size={11} /></span>
                      {s.city}
                    </span>
                    <span style={{ color: C.textDim, fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1 }}>
                      {s.state}
                    </span>
                  </button>
                ))}
              </div>
            )}
          </div>

          {error && (
            <div style={{ color: C.accent, fontSize: 12, fontFamily: "'IBM Plex Mono', monospace", letterSpacing: 1 }}>⚠ {error}</div>
          )}

          <div>
            <label style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: 2, color: C.textDim }}>WORK ADDRESS <span style={{ color: C.textDim, opacity: 0.6 }}>(optional)</span></label>
            <input
              value={address}
              onChange={(e) => setAddress(e.target.value)}
              placeholder="123 Main St, Suite 400"
              className="w-full mt-1 px-3 py-2.5 rounded-lg outline-none transition-all"
              style={{ background: 'rgba(255,255,255,0.03)', border: `1px solid ${C.border}`, color: C.text,
                fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14 }}
              onFocus={(e) => e.target.style.borderColor = C.accent}
              onBlur={(e) => e.target.style.borderColor = C.border} />
          </div>

          <div>
            <label style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: 2, color: C.textDim }}>RELATIONSHIP NOTES <span style={{ color: C.textDim, opacity: 0.6 }}>(optional)</span></label>
            <textarea
              value={notes}
              onChange={(e) => setNotes(e.target.value)}
              placeholder="Context, history, key contacts, terms…"
              rows={3}
              className="w-full mt-1 px-3 py-2.5 rounded-lg outline-none transition-all resize-none"
              style={{ background: 'rgba(255,255,255,0.03)', border: `1px solid ${C.border}`, color: C.text,
                fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, lineHeight: 1.5 }}
              onFocus={(e) => e.target.style.borderColor = C.accent}
              onBlur={(e) => e.target.style.borderColor = C.border} />
          </div>

          <button
            onClick={submit}
            className="w-full py-3 rounded-lg flex items-center justify-center gap-2 transition-transform"
            onMouseEnter={(e) => e.currentTarget.style.transform = 'scale(1.01)'}
            onMouseLeave={(e) => e.currentTarget.style.transform = 'scale(1)'}
            onMouseDown={(e) => e.currentTarget.style.transform = 'scale(0.99)'}
            onMouseUp={(e) => e.currentTarget.style.transform = 'scale(1.01)'}
            style={{
              background: `linear-gradient(135deg, ${C.accent} 0%, ${BRAND.gold} 130%)`,
              color: '#0A1F3D', fontFamily: "'IBM Plex Sans', sans-serif",
              fontWeight: 700, fontSize: 14, letterSpacing: 0.5,
              boxShadow: `0 8px 28px ${C.accentSoft}`, border: 'none', cursor: 'pointer',
            }}>
            <IcPlus size={16} strokeWidth={3} /> DROP PIN
          </button>
        </div>
      );
    }

    /* ============================================================
       LIST
       ============================================================ */
    function AssetList({ assets, hoveredId, setHoveredId, filter, setFilter, setSelectedId, searchQuery, setSearchQuery, matchedIds }) {
      // Apply type filter, then search filter
      const typeFiltered = filter === 'all' ? assets : assets.filter(a => a.type === filter);
      const filtered = (searchQuery && searchQuery.trim())
        ? typeFiltered.filter(a => matchedIds.has(a.id))
        : typeFiltered;

      // Open the Beacon Location page (parent window has the router)
      const openLocation = (a) => {
        try {
          window.parent.postMessage({ type: 'beacon-open-location', locationId: a.id }, '*');
        } catch (e) {}
      };

      return (
        <div className="space-y-3">
          <div className="flex items-baseline justify-between">
            <h3 style={{ fontFamily: "'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif",
              fontSize: 13, fontWeight: 600, letterSpacing: 3, color: C.text, textTransform: 'uppercase' }}>Locations</h3>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: C.textDim, letterSpacing: 2 }}>
              {String(filtered.length).padStart(2, '0')} / {String(assets.length).padStart(2, '0')}
            </span>
          </div>

          {/* SEARCH INPUT — drives pin highlighting on the map */}
          <div style={{ position: 'relative' }}>
            <span style={{ position: 'absolute', left: 10, top: '50%', transform: 'translateY(-50%)',
              color: C.textDim, fontSize: 12, pointerEvents: 'none' }}>🔍</span>
            <input
              type="search"
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder="Search city, address, fuel…"
              autoComplete="off"
              style={{
                width: '100%', padding: '8px 28px 8px 30px',
                background: 'rgba(0,0,0,0.30)', color: C.text,
                border: `1px solid ${C.border}`, borderRadius: 8,
                fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12.5,
                outline: 'none',
              }}
            />
            {searchQuery && (
              <button onClick={() => setSearchQuery('')}
                style={{ position: 'absolute', right: 6, top: '50%', transform: 'translateY(-50%)',
                  background: 'transparent', border: 'none', color: C.textMuted, cursor: 'pointer',
                  fontSize: 14, lineHeight: 1, padding: '2px 6px' }}
                aria-label="Clear search">×</button>
            )}
          </div>

          {/* Fuel-type filter chips */}
          <div className="flex flex-wrap gap-1.5">
            {[
              ['all', 'All', null],
              ['employee', 'Electric', C.employee],
              ['partner', 'Gas', C.partner],
              ['contractor', 'Dual', C.contractor],
            ].map(([k, label, col]) => (
              <button key={k} onClick={() => setFilter(k)}
                className="px-2.5 py-1 rounded-md transition-colors"
                style={{
                  background: filter === k ? (col || C.text) + '22' : 'rgba(255,255,255,0.02)',
                  border: `1px solid ${filter === k ? (col || C.text) : C.border}`,
                  color: filter === k ? (col || C.text) : C.textMuted,
                  fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: 1.5,
                  cursor: 'pointer',
                }}>
                {label.toUpperCase()}
              </button>
            ))}
          </div>

          <div className="space-y-1.5 overflow-y-auto pr-1" style={{ maxHeight: '42vh', scrollbarWidth: 'thin' }}>
            {filtered.length === 0 && (
              <div className="text-center py-8 rounded-lg"
                style={{ border: `1px dashed ${C.border}`, color: C.textDim,
                  fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 12 }}>
                {assets.length === 0
                  ? 'No locations in portfolio yet.'
                  : (searchQuery ? `No matches for "${searchQuery}".` : 'No locations match this filter.')}
              </div>
            )}
            {filtered.map(a => {
              const meta = TYPE_META[a.type];
              const Ico = meta.Icon;
              const active = hoveredId === a.id;
              return (
                <div key={a.id}
                  onMouseEnter={() => setHoveredId(a.id)}
                  onMouseLeave={() => setHoveredId(null)}
                  onClick={() => openLocation(a)}
                  className="group flex items-center gap-3 px-3 py-2 rounded-lg transition-all cursor-pointer"
                  style={{
                    background: active ? `${meta.color}1A` : 'rgba(255,255,255,0.02)',
                    border: `1px solid ${active ? meta.color : C.border}`,
                    boxShadow: active ? `0 0 18px ${meta.color}25` : 'none',
                  }}>
                  <div className="flex items-center justify-center rounded-md flex-shrink-0"
                    style={{ width: 32, height: 32, background: `${meta.color}22`, color: meta.color,
                      boxShadow: `inset 0 0 8px ${meta.color}33` }}>
                    <Ico size={15} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="truncate" style={{
                      color: C.text, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, fontWeight: 500,
                    }}>{a.name}</div>
                    <div style={{
                      color: C.textMuted, fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, letterSpacing: 0.5,
                    }}>{a.city}, {a.state} {a.approximate && '· approx'}</div>
                  </div>
                  <button onClick={(e) => { e.stopPropagation(); openLocation(a); }}
                    className="opacity-0 group-hover:opacity-100 transition-opacity px-2 py-1 rounded"
                    style={{ color: C.text, background: `${meta.color}22`, border: `1px solid ${meta.color}55`,
                      cursor: 'pointer', fontFamily: "'IBM Plex Mono', monospace", fontSize: 9.5, letterSpacing: 1 }}
                    aria-label="Open in Beacon">
                    OPEN →
                  </button>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ============================================================
       CLUSTER LIST — opens when a multi-asset pin is clicked
       ============================================================ */
    function ClusterList({ cluster, onSelectAsset, onClose }) {
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      if (!cluster) return null;
      const n = cluster.assets.length;
      const counts = cluster.assets.reduce((acc, a) => { acc[a.type] = (acc[a.type] || 0) + 1; return acc; }, {});
      // pick accent color: if all same type, use it; else use orange
      const sameType = Object.keys(counts).length === 1;
      const accent = sameType ? TYPE_META[Object.keys(counts)[0]].color : C.accent;

      return (
        <>
          <div onClick={onClose}
            style={{
              position: 'fixed', inset: 0, zIndex: 50,
              background: 'rgba(3,8,15,0.7)', backdropFilter: 'blur(4px)',
            }} />

          <div role="dialog" aria-modal="true"
            style={{
              position: 'fixed', zIndex: 51,
              top: 'calc(var(--vp-top, 0px) + var(--vp-h, 100vh) / 2)', left: '50%',
              transform: 'translate(-50%, -50%)',
              width: 'min(560px, calc(100vw - 32px))',
              maxHeight: 'calc(var(--vp-h, 100vh) - 48px)',
              display: 'flex', flexDirection: 'column',
              background: C.panelSolid,
              border: `1px solid ${accent}`,
              borderRadius: 16,
              boxShadow: `0 24px 80px rgba(0,0,0,0.6), 0 0 60px ${accent}22`,
              overflow: 'hidden',
            }}>
            <div style={{ height: 3, width: '100%', background: accent }} />

            {/* header */}
            <div style={{ padding: '20px 24px 14px', display: 'flex', alignItems: 'flex-start', gap: 14, borderBottom: `1px solid ${C.border}` }}>
              <div style={{
                width: 48, height: 48, borderRadius: 10,
                background: `${accent}22`, color: accent,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: `inset 0 0 12px ${accent}44, 0 0 18px ${accent}33`,
                flexShrink: 0,
              }}>
                <IcMapPin size={22} />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{
                  fontFamily: "'IBM Plex Sans', sans-serif",
                  fontSize: 20, fontWeight: 600, color: C.text, lineHeight: 1.2,
                }}>
                  {cluster.city}, {cluster.state}
                </div>
                <div style={{
                  marginTop: 4,
                  fontFamily: "'IBM Plex Mono', monospace",
                  fontSize: 10, letterSpacing: 2, color: accent, fontWeight: 600,
                }}>
                  {n} LOCATIONS · SELECT ONE TO VIEW DETAILS
                </div>
                {/* type breakdown chips */}
                <div style={{ marginTop: 10, display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                  {Object.entries(counts).map(([k, c]) => {
                    const m = TYPE_META[k];
                    return (
                      <span key={k} style={{
                        display: 'inline-flex', alignItems: 'center', gap: 6,
                        padding: '3px 9px', borderRadius: 999,
                        background: `${m.color}1A`, border: `1px solid ${m.color}55`,
                        color: m.color,
                        fontFamily: "'IBM Plex Mono', monospace",
                        fontSize: 10, letterSpacing: 1.2, fontWeight: 600,
                      }}>
                        <span style={{ width: 6, height: 6, borderRadius: '50%', background: m.color, boxShadow: `0 0 6px ${m.color}` }} />
                        {c} {m.label.toUpperCase()}
                      </span>
                    );
                  })}
                </div>
              </div>
              <button onClick={onClose} aria-label="Close"
                style={{
                  background: 'transparent', border: 'none', color: C.textMuted,
                  cursor: 'pointer', padding: 6, borderRadius: 6, flexShrink: 0,
                }}
                onMouseEnter={(e) => { e.currentTarget.style.background = 'rgba(255,255,255,0.05)'; e.currentTarget.style.color = C.text; }}
                onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = C.textMuted; }}>
                <IcX size={18} />
              </button>
            </div>

            {/* asset list (scrollable if long) */}
            <div style={{ overflowY: 'auto', padding: 12 }}>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {cluster.assets.map(a => {
                  const m = TYPE_META[a.type];
                  const I = m.Icon;
                  return (
                    <button key={a.id}
                      onClick={() => {
                        try { window.parent.postMessage({ type: 'beacon-open-location', locationId: a.id }, '*'); } catch (e) {}
                        onClose();
                      }}
                      style={{
                        display: 'flex', alignItems: 'center', gap: 12,
                        padding: '12px 14px', borderRadius: 10,
                        background: 'rgba(255,255,255,0.02)',
                        border: `1px solid ${C.border}`,
                        color: C.text, textAlign: 'left',

                        transition: 'all 120ms ease',

                          fontFamily: "'IBM Plex Sans', sans-serif",

                        }}>{a.name}</div>
                        <div style={{
                          marginTop: 2,
                          fontFamily: "'IBM Plex Sans', sans-serif",

                        }}>
                          {a.company || <span style={{ fontStyle: 'italic', color: C.textDim }}>no company</span>}
                        </div>
                      </div>
                      <div style={{
                        fontFamily: "'IBM Plex Mono', monospace",
                        fontSize: 9, letterSpacing: 1.5, color: m.color, fontWeight: 600,
                        flexShrink: 0, paddingLeft: 8,
                      }}>
                        {m.label.toUpperCase()}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </>
      );
    }

    /* ============================================================
       INFO CARD — opens when a pin is clicked
       ============================================================ */
    function InfoCard({ asset, onClose, onUpdate, onRemove, fromCluster, onBack }) {
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(asset);

      // reset draft when a different asset is selected
      useEffect(() => { setDraft(asset); setEditing(false); }, [asset?.id]);

      // close on Escape
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      if (!asset) return null;
      const meta = TYPE_META[asset.type];
      const Ico = meta.Icon;

      const save = () => {
        onUpdate(asset.id, {
          name: (draft.name || '').trim() || asset.name,
          company: (draft.company || '').trim(),
          address: (draft.address || '').trim(),
          notes: (draft.notes || '').trim(),
          type: draft.type || asset.type,
        });
        setEditing(false);
      };

      const fieldStyle = {
        background: 'rgba(255,255,255,0.03)',
        border: `1px solid ${C.border}`,
        color: C.text,
        fontFamily: "'IBM Plex Sans', sans-serif",
        fontSize: 14,
        borderRadius: 8,
        padding: '8px 12px',
        outline: 'none',
        width: '100%',
      };

      return (
        <>
          {/* backdrop */}
          <div
            onClick={onClose}
            style={{
              position: 'fixed', inset: 0, zIndex: 50,
              background: 'rgba(3,8,15,0.7)',
              backdropFilter: 'blur(4px)',
            }} />

          {/* card */}
          <div
            role="dialog"
            aria-modal="true"
            style={{
              position: 'fixed', zIndex: 51,
              top: 'calc(var(--vp-top, 0px) + var(--vp-h, 100vh) / 2)', left: '50%',
              transform: 'translate(-50%, -50%)',
              width: 'min(560px, calc(100vw - 32px))',
              maxHeight: 'calc(var(--vp-h, 100vh) - 48px)',
              overflowY: 'auto',
              background: C.panelSolid,
              border: `1px solid ${meta.color}`,
              borderRadius: 16,
              boxShadow: `0 24px 80px rgba(0,0,0,0.6), 0 0 60px ${meta.color}22`,

                  borderBottom: `1px solid ${C.border}`,
                  color: C.textMuted, cursor: 'pointer',
                  fontFamily: "'IBM Plex Mono', monospace",

                onMouseLeave={(e) => { e.currentTarget.style.color = C.textMuted; }}>
                ← BACK TO {fromCluster.city.toUpperCase()}, {fromCluster.state} ({fromCluster.assets.length} ASSETS)
              </button>

            {/* header */}
            <div style={{ padding: '20px 24px 12px', display: 'flex', alignItems: 'flex-start', gap: 14 }}>
              <div style={{
                width: 48, height: 48, borderRadius: 10,
                background: `${meta.color}22`, color: meta.color,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: `inset 0 0 12px ${meta.color}44, 0 0 18px ${meta.color}33`,

              }}>
                <Ico size={22} />

              <div style={{ flex: 1, minWidth: 0 }}>

                  <input

                ) : (
                  <div style={{
                    fontFamily: "'IBM Plex Sans', sans-serif",
                    fontSize: 20, fontWeight: 600, color: C.text, lineHeight: 1.2,
                    overflow: 'hidden', textOverflow: 'ellipsis',
                  }}>{asset.name}</div>
                )}
                <div style={{
                  marginTop: 4,
                  fontFamily: "'IBM Plex Mono', monospace",
                  fontSize: 10, letterSpacing: 2, color: meta.color, fontWeight: 600,
                }}>
                  {meta.label.toUpperCase()} · {asset.city}, {asset.state}

                    const I = m.Icon;
                    const active = (draft.type || asset.type) === k;
                    return (
                      <button key={k} onClick={() => setDraft({ ...draft, type: k })}
                        className="flex flex-col items-center justify-center gap-1.5 py-2.5 rounded-lg transition-all"
                        style={{
                          background: active ? `${m.color}25` : 'rgba(255,255,255,0.02)',
                          border: `1px solid ${active ? m.color : C.border}`,
                          color: active ? m.color : C.textMuted,
                          boxShadow: active ? `0 0 12px ${m.color}33` : 'none',
                          cursor: 'pointer',
                        }}>
                        <I size={16} />
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: 1.5 }}>
                          {m.label.toUpperCase()}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* fields */}
            <div style={{ padding: '8px 24px 4px', display: 'flex', flexDirection: 'column', gap: 14 }}>
              {/* COMPANY */}
              <div>
                <label style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: 2, color: C.textDim }}>COMPANY</label>
                {editing ? (
                  <input
                    value={draft.company || ''}
                    onChange={(e) => setDraft({ ...draft, company: e.target.value })}
                    placeholder="Company name"
                    style={{ ...fieldStyle, marginTop: 4 }} />
                ) : (
                  <div style={{
                    marginTop: 4, fontFamily: "'IBM Plex Sans', sans-serif",
                    fontSize: 15, color: asset.company ? C.text : C.textDim,
                  }}>
                    {asset.company || <span style={{ fontStyle: 'italic' }}>— not set —</span>}
                  </div>
                )}
              </div>

              {/* WORK ADDRESS */}
              <div>
                <label style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: 2, color: C.textDim }}>WORK ADDRESS</label>
                {editing ? (
                  <input
                    value={draft.address || ''}
                    onChange={(e) => setDraft({ ...draft, address: e.target.value })}
                    placeholder="Street, suite, city, state, zip"
                    style={{ ...fieldStyle, marginTop: 4 }} />
                ) : (
                  <div style={{
                    marginTop: 4, fontFamily: "'IBM Plex Sans', sans-serif",
                    fontSize: 14, color: asset.address ? C.text : C.textDim, lineHeight: 1.45,
                  }}>
                    {asset.address || <span style={{ fontStyle: 'italic' }}>— not set —</span>}
                  </div>
                )}
              </div>

              {/* NOTES */}
              <div>
                <label style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: 2, color: C.textDim }}>RELATIONSHIP NOTES</label>
                {editing ? (
                  <textarea
                    value={draft.notes || ''}
                    onChange={(e) => setDraft({ ...draft, notes: e.target.value })}
                    placeholder="Context, history, key contacts, terms…"
                    rows={5}
                    style={{ ...fieldStyle, marginTop: 4, lineHeight: 1.5, fontSize: 13.5, resize: 'vertical', minHeight: 100 }} />
                ) : (
                  <div style={{
                    marginTop: 4, padding: '12px 14px', borderRadius: 8,
                    background: 'rgba(255,255,255,0.02)',
                    border: `1px solid ${C.border}`,
                    fontFamily: "'IBM Plex Sans', sans-serif",
                    fontSize: 13.5, color: asset.notes ? C.text : C.textDim,
                    lineHeight: 1.55, whiteSpace: 'pre-wrap', minHeight: 60,
                  }}>
                    {asset.notes || <span style={{ fontStyle: 'italic' }}>No notes yet. Click Edit to add.</span>}
                  </div>
                )}
              </div>
            </div>

            {/* footer */}
            <div style={{
              display: 'flex', alignItems: 'center', justifyContent: 'flex-end',
              gap: 12, padding: '16px 24px 20px', marginTop: 8,
              borderTop: `1px solid ${C.border}`,
            }}>
              <button
                onClick={() => {
                  try { window.parent.postMessage({ type: 'beacon-open-location', locationId: asset.id }, '*'); } catch (e) {}
                  onClose();
                }}
                style={{
                  background: `linear-gradient(135deg, ${C.accent} 0%, ${BRAND.gold} 130%)`,
                  color: '#0A1F3D', border: 'none',
                  padding: '10px 18px', borderRadius: 8,
                  fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, fontWeight: 700, letterSpacing: 0.5,
                  boxShadow: `0 6px 20px ${C.accentSoft}`, cursor: 'pointer',
                  display: 'inline-flex', alignItems: 'center', gap: 8,
                }}>
                OPEN LOCATION PAGE →
              </button>
            </div>
          </div>
        </>
      );
    }

    /* ============================================================
       MAIN
       ============================================================ */
    function STSAssetMap() {
      // ── BEACON ADAPTER ────────────────────────────────────────────
      // Read Beacon's portfolio for the given clientId from localStorage
      // (same origin as the host page), aggregate accounts into
      // locations, and present each location as an "asset" so the
      // existing SVG-map / popup / list code can render it unchanged.
      const [assets, setAssets] = useState(() => {
        try {
          const qp = new URLSearchParams(window.location.search);
          const clientId = qp.get('clientId') || qp.get('client') || '';
          if (!clientId) return [];
          const all = JSON.parse(localStorage.getItem('sts_portfolios_v1') || '{}');
          const accts = (all[clientId] && Array.isArray(all[clientId])) ? all[clientId] : [];
          if (!accts.length) return [];

          // address-key normalizer — MUST match beacon-index.html's _locNorm
          const norm = (s) => String(s == null ? '' : s).toLowerCase().trim().replace(/\s+/g, ' ');
          const locId = (key) => {
            try {
              return btoa(unescape(encodeURIComponent(key))).replace(/[+/=]/g,
                c => ({ '+': '-', '/': '_', '=': '' }[c]));
            } catch (e) { return key.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0,80); }
          };

          // Aggregate accounts by address|city|state into locations
          const byLoc = new Map();
          for (const a of accts) {
            const address = a.address || a.serviceAddress || a.name || '';
            const city    = a.city  || '';
            const state   = a.state || '';
            if (!city || !state) continue;
            const key = [norm(address), norm(city), norm(state)].join('|');
            if (!byLoc.has(key)) {
              byLoc.set(key, { address, city, state, accountCount: 0, hasElectric: false, hasGas: false, kwh: 0, therms: 0, spend: 0 });
            }
            const row = byLoc.get(key);
            row.accountCount++;
            const fuel = String(a.fuelType || a.fuel || a.utilityType || '').toLowerCase();
            if (fuel.includes('elec')) { row.hasElectric = true; row.kwh += +(a.annualUsage || a.kwh || 0) || 0; }
            if (fuel.includes('gas'))  { row.hasGas      = true; row.therms += +(a.annualUsage || a.therms || 0) || 0; }
            row.spend += +(a.annualSpend || a.spend || 0) || 0;
          }

          // Convert to asset-shape rows, geocoding by "City, ST"
          const out = [];
          for (const [key, loc] of byLoc.entries()) {
            const g = geocode(`${loc.city}, ${loc.state}`);
            if (!g) continue;
            const fuelLabel =
              (loc.hasElectric && loc.hasGas) ? 'Dual-fuel' :
              loc.hasGas ? 'Gas only' :
              loc.hasElectric ? 'Electric only' : 'Other';
            const fuelType =
              (loc.hasElectric && loc.hasGas) ? 'contractor' :
              loc.hasGas ? 'partner' :
              'employee';
            const noteParts = [];
            if (loc.accountCount > 1) noteParts.push(`${loc.accountCount} accounts`);
            if (loc.spend > 0) noteParts.push(`$${Math.round(loc.spend).toLocaleString()} / yr`);
            noteParts.push(fuelLabel);
            out.push({
              id: locId(key),
              _addrKey: key,
              name: loc.address || `${loc.city}, ${loc.state}`,
              type: fuelType,
              company: fuelLabel,
              address: loc.address || `${loc.city}, ${loc.state}`,
              city: loc.city,
              state: loc.state,
              lat: g.lat,
              lng: g.lng,
              approximate: g.approximate || !loc.address,
              notes: noteParts.join(' · '),
              accountCount: loc.accountCount,
              hasElectric: loc.hasElectric,
              hasGas: loc.hasGas,
              spend: loc.spend,
            });
          }
          return out;
        } catch (e) {
          console.error('[beacon-map] portfolio load failed:', e);
          return [];
        }
      });
      const [hoveredId, setHoveredId] = useState(null);
      const [selectedId, setSelectedId] = useState(null);
      const [selectedClusterKey, setSelectedClusterKey] = useState(null);
      const [filter, setFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      // Hide the boot loader once mounted
      useEffect(() => {
        const boot = document.getElementById('boot');
        if (boot) { boot.classList.add('gone'); setTimeout(() => boot && boot.remove(), 500); }
      }, []);

      // Compute matched ids from search query — drives pin glow + list filter
      const matchedIds = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return new Set();
        const hits = new Set();
        for (const a of assets) {
          const hay = `${a.name} ${a.address || ''} ${a.city} ${a.state} ${a.company || ''}`.toLowerCase();
          if (hay.includes(q)) hits.add(a.id);
        }
        return hits;
      }, [searchQuery, assets]);

      const addAsset = (a) => setAssets(curr => [...curr, a]);
      const removeAsset = (id) => {
        setAssets(curr => curr.filter(a => a.id !== id));
        if (selectedId === id) setSelectedId(null);
      };
      const updateAsset = (id, patch) => setAssets(curr => curr.map(a => a.id === id ? { ...a, ...patch } : a));
      const selectedAsset = useMemo(() => assets.find(a => a.id === selectedId) || null, [assets, selectedId]);

      // cluster the user is currently viewing (or came from)
      const viewCluster = useMemo(() => {
        if (!selectedClusterKey) return null;
        const [city, state] = selectedClusterKey.split('|');
        const clusterAssets = assets.filter(a => a.city === city && a.state === state);
        if (!clusterAssets.length) return null;
        return { key: selectedClusterKey, city, state, assets: clusterAssets };
      }, [selectedClusterKey, assets]);

      const counts = useMemo(() => ({
        employee:   assets.filter(a => a.type === 'employee').length,
        partner:    assets.filter(a => a.type === 'partner').length,
        contractor: assets.filter(a => a.type === 'contractor').length,
      }), [assets]);

      return (
        <div className="min-h-screen w-full"
          style={{
            background: `linear-gradient(180deg, ${C.bg} 0%, #03080F 100%)`,
            color: C.text, fontFamily: "'IBM Plex Sans', system-ui, sans-serif",
          }}>
          <header className="border-b px-6 py-4 flex items-center justify-between"
            style={{ borderColor: C.border, background: 'rgba(6,16,31,0.85)', backdropFilter: 'blur(8px)' }}>
            <div className="flex items-center gap-3">
              <div className="flex items-center justify-center rounded-md"
                style={{ width: 40, height: 40,
                  background: `linear-gradient(135deg, ${BRAND.navy}, #16345E)`,
                  border: `1px solid ${C.border}`,
                  boxShadow: `0 0 0 2px ${C.accentSoft}, 0 0 20px ${C.accentSoft}` }}>
                <span style={{ color: C.accent }}><IcRadio size={20} /></span>
              </div>
              <div>
                <div style={{ fontFamily: "'IBM Plex Sans Condensed', sans-serif",
                  fontSize: 19, fontWeight: 700, letterSpacing: 4, color: C.text }}>
                  BEACON&nbsp;<span style={{ color: C.accent }}>·</span>&nbsp;PORTFOLIO MAP
                </div>
                <div style={{ fontFamily: "'IBM Plex Mono', monospace",
                  fontSize: 10, color: C.textDim, letterSpacing: 2 }}>
                  CLIENT LOCATIONS
                </div>
              </div>
            </div>

            <div className="hidden md:flex items-center gap-4">
              {Object.entries(TYPE_META).map(([k, meta]) => (
                <div key={k} className="flex items-center gap-2">
                  <span className="inline-block rounded-full"
                    style={{ width: 10, height: 10, background: meta.color,
                      boxShadow: `0 0 14px ${meta.color}, 0 0 4px ${meta.color}` }} />
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace",
                    fontSize: 11, letterSpacing: 1.5, color: C.textMuted }}>
                    {meta.label}<span style={{ color: C.text, marginLeft: 6 }}>{counts[k]}</span>
                  </span>
                </div>
              ))}
            </div>
          </header>

          <div className="mx-auto px-6 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6" style={{ maxWidth: 1500 }}>
            <div className="rounded-2xl overflow-hidden relative lg:col-span-2"
              style={{ background: C.panelSolid, border: `1px solid ${C.border}` }}>
              <div className="absolute top-0 left-0 right-0 overflow-hidden" style={{ pointerEvents: 'none', height: 1 }}>
                <div style={{ height: 1, width: '100%',
                  background: `linear-gradient(90deg, transparent, ${C.accent}55, transparent)` }} />
              </div>
              <USMap assets={assets} hoveredId={hoveredId} setHoveredId={setHoveredId}
                selectedId={selectedId} setSelectedId={setSelectedId}
                selectedClusterKey={selectedClusterKey} setSelectedClusterKey={setSelectedClusterKey}
                matchedIds={matchedIds} />
              <div className="md:hidden px-4 py-3 flex items-center justify-around border-t" style={{ borderColor: C.border }}>
                {Object.entries(TYPE_META).map(([k, meta]) => (
                  <div key={k} className="flex items-center gap-1.5">
                    <span className="inline-block rounded-full" style={{ width: 8, height: 8, background: meta.color, boxShadow: `0 0 10px ${meta.color}` }} />
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: C.textMuted, letterSpacing: 1 }}>
                      {meta.label} <span style={{ color: C.text }}>{counts[k]}</span>
                    </span>
                  </div>
                ))}
              </div>
            </div>

            <aside className="space-y-5">
              <div className="rounded-2xl p-5" style={{ background: C.panelSolid, border: `1px solid ${C.border}` }}>
                <AssetList
                  assets={assets} hoveredId={hoveredId} setHoveredId={setHoveredId}
                  filter={filter} setFilter={setFilter}
                  setSelectedId={setSelectedId}
                  searchQuery={searchQuery} setSearchQuery={setSearchQuery}
                  matchedIds={matchedIds} />
              </div>
            </aside>
          </div>

          <div className="mx-auto px-6 pb-8 flex items-center justify-between"
            style={{ maxWidth: 1500, fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 10, color: C.textDim, letterSpacing: 2 }}>
            <span>BEACON / PORTFOLIO-MAP / V1.0</span>
            <span>{new Date().toISOString().slice(0, 10).toUpperCase()} · {assets.length} LOCATIONS</span>
          </div>

          {selectedAsset ? (
            <InfoCard
              asset={selectedAsset}
              fromCluster={viewCluster}
              onBack={viewCluster ? () => setSelectedId(null) : null}
              onClose={() => { setSelectedId(null); setSelectedClusterKey(null); }}
              onUpdate={updateAsset}
              onRemove={removeAsset} />
          ) : viewCluster ? (
            <ClusterList
              cluster={viewCluster}
              onSelectAsset={(id) => setSelectedId(id)}
              onClose={() => setSelectedClusterKey(null)} />
          ) : null}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<STSAssetMap />);
    requestAnimationFrame(() => {
      const b = document.getElementById('boot');
      if (b) { b.classList.add('gone'); setTimeout(() => b.remove(), 500); }
    });
  </script>
</body>
</html>
