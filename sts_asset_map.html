    function parseClientId() {
      try {
        const params = new URLSearchParams(window.location.search);
        return params.get('clientId') || params.get('client') || null;
      } catch (e) { return null; }
    }

    function parseMode() {
      try {
        const params = new URLSearchParams(window.location.search);
        return (params.get('mode') || '').toLowerCase();
      } catch (e) { return ''; }
    }

    function parseClientName() {
      try {
        const params = new URLSearchParams(window.location.search);
        return params.get('clientName') || params.get('client') || '';
      } catch (e) { return ''; }
    }

    function normalizeCity(c) {
      if (!c) return '';
      let out = String(c).trim().replace(/[,.]+$/, '').replace(/\s+/g, ' ');
      // Title-case: "DISTRICT HEIGHTS" → "District Heights"
      out = out.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
      return out;
    }

    function geocodeCityState(city, state) {
      const c = normalizeCity(city);
      const s = (state || '').trim().toUpperCase();
      let key = c + '|' + s;
      if (TYPO_MAP[key]) key = TYPO_MAP[key];
      let coords = CITY_COORDS[key];
      if (!coords) coords = STATE_CENTERS[s];
      return coords ? { lat: coords[0], lng: coords[1], approximate: !CITY_COORDS[key] }
                    : { lat: 39.0, lng: -98.0, approximate: true };
    }

    function statusToType(status) {
      if (!status) return 'other';
      const s = String(status).trim().toLowerCase();
      if (s === 'eligible')   return 'eligible';
      if (s === 'contracted') return 'contracted';
      return 'other';  // Ineligible, No Usage, Usage Below State Min, etc.
    }

    function adaptLocation(loc) {
      const g = geocodeCityState(loc.city, loc.state);
      // Tiny per-id jitter so multiple service points at the same city
      // don't pile on a single pixel (radius ~6km).
      const idHash = (typeof loc.id === 'number' ? loc.id : 0) || 0;
      const dx = ((idHash * 0.0173) % 0.12) - 0.06;
      const dy = ((idHash * 0.0241) % 0.12) - 0.06;
      return {
        id: loc.id || (Date.now() + Math.random()),
        type: statusToType(loc.status),
        // Display fields
        name: loc.address || `${loc.city || ''}, ${loc.state || ''}`,
        company: loc.utility || '',
        utility: loc.utility || '',
        supplier: loc.supplier || '',
        accountType: loc.type || '',  // 'Gas' | 'Electric'
        status: loc.status || '',
        usage: loc.usage,
        sqft: loc.sqft,
        storeCode: loc.storeCode || '',
        account: loc.account || '',
        contract: (loc.contract && loc.contract !== 'nan') ? loc.contract : '',
        exp: loc.exp || '',
        // Address bits
        address: loc.address || '',
        city: normalizeCity(loc.city),
        state: (loc.state || '').toUpperCase(),
        zip: loc.zip && loc.zip !== 'nan' ? loc.zip : '',
        // Map placement
        lat: g.lat + dy,
        lng: g.lng + dx,
        approximate: g.approximate,
        // Preserve raw record so we can persist back without losing fields
        _raw: loc,
      };
    }

    function loadPortfolio() {
      const clientId = parseClientId();
      if (!clientId) {
        console.warn('[portfolio] No clientId in URL — map will be empty.');
        return [];
      }
      try {
        const all = JSON.parse(localStorage.getItem(PORTFOLIO_STORAGE_KEY) || '{}');
        const locs = all[clientId];
        if (!Array.isArray(locs) || locs.length === 0) {
          console.warn(`[portfolio] No locations found for clientId=${clientId}.`);
          return [];
        }
        const adapted = locs.map(adaptLocation);
        console.log(`[portfolio] Loaded ${adapted.length} locations for clientId=${clientId}.`);
        return adapted;
      } catch (e) {
        console.error('[portfolio] Failed to load:', e);
        return [];
      }
    }

    function persistPortfolio(assets) {
      const clientId = parseClientId();
      if (!clientId) return;
      try {
        const all = JSON.parse(localStorage.getItem(PORTFOLIO_STORAGE_KEY) || '{}');
        // Convert assets back to source-shape records, preserving any _raw
        // fields so non-mapped data (like CostCenterNumber) survives a round trip.
        all[clientId] = assets.map(a => {
          const base = a._raw || {};
          return {
            ...base,
            id: a.id,
            address: a.address,
            city: a.city,
            state: a.state,
            zip: a.zip,
            sqft: (a.sqft === undefined ? base.sqft : a.sqft),
            storeCode: a.storeCode || base.storeCode || '',
            utility: a.utility || a.company || '',
            supplier: a.supplier || base.supplier || '',
            type: a.accountType || base.type || '',
            status: a.status || base.status || '',
            usage: (a.usage === undefined ? base.usage : a.usage),
            contract: a.contract || base.contract || 'nan',
            exp: a.exp || base.exp || '',
            account: a.account || base.account || '',
          };
        });
        localStorage.setItem(PORTFOLIO_STORAGE_KEY, JSON.stringify(all));
      } catch (e) {
        console.error('[portfolio] Failed to persist:', e);
      }
    }

    // dashboard Energy Intelligence tab (loaded via benchmarks.js).
    function parsePortfolioBtype() {
      try {
        const v = new URLSearchParams(window.location.search).get('btype');
        return v || 'office';
      } catch(e) { return 'office'; }
    }
    const PORTFOLIO_BTYPE = parsePortfolioBtype();

    // Fuel-mix palette for map pins. Same-fuel locations use their natural
    // color; locations with both Electric and Gas use a distinct teal so
    // dual-fuel sites are visually obvious on the map.
    const FUEL_META = {
      electric: { color: '#22c55e', label: 'Electric',         plural: 'Electric'    },
      gas:      { color: '#3B82F6', label: 'Gas',              plural: 'Gas'         },
      both:     { color: '#06b6d4', label: 'Electric + Gas',   plural: 'Dual-fuel'   },
      none:     { color: '#64748b', label: 'Unknown',          plural: 'Unknown'     },
    };

    // Group accounts by physical location identity (normalized address+city+state)
    const PARTICIPATING_RE = /(particip|enroll|active|approv|signed|contract)/i;
    const INELIGIBLE_RE   = /(inelig|n\/a|deregul|exclud|not\s*available|not\s*elig)/i;

    function _normalizeForKey(s) {
      return String(s || '').toLowerCase().trim()
        .replace(/[^\w\s]/g, '')
        .replace(/\s+/g, ' ');
    }
    function locationKey(a) {
      const addr = _normalizeForKey(a.address);
      if (!addr) return null;
      return [addr, _normalizeForKey(a.city), _normalizeForKey(a.state)].join('|');
    }

    function aggregateLocations(accounts) {
      const map = new Map();
      const orphans = [];
      for (const a of accounts) {
        const k = locationKey(a);
        if (!k) { orphans.push(a); continue; }
        if (!map.has(k)) {
          map.set(k, {
            id: k, locationKey: k,
            name: a.name, address: a.address,
            city: a.city, state: a.state,
            zip: a.zip, storeCode: a.storeCode,
            lat: a.lat, lng: a.lng,
            approximate: a.approximate, _fresh: a._fresh,
            accounts: [],
          });
        }
        const loc = map.get(k);
        loc.accounts.push(a);
        if (a._fresh) loc._fresh = true;
        if (loc.approximate && !a.approximate) {
          loc.lat = a.lat; loc.lng = a.lng; loc.approximate = false;
        }
        // Take location-level fields from any account that has them
        if (!loc.zip       && a.zip)       loc.zip = a.zip;
        if (!loc.storeCode && a.storeCode) loc.storeCode = a.storeCode;
      }
      // Orphans (no parseable address) become single-account locations
      for (const a of orphans) {
        const k = 'orphan_' + a.id;
        map.set(k, {
          id: k, locationKey: k,
          name: a.name, address: a.address, city: a.city, state: a.state,
          zip: a.zip, storeCode: a.storeCode,
          lat: a.lat, lng: a.lng, approximate: a.approximate, _fresh: a._fresh,
          accounts: [a],
        });
      }
      // Derive aggregates
      const out = [];
      for (const loc of map.values()) {
        const types = new Set(loc.accounts.map(a => a.accountType));
        loc.hasElectric = types.has('Electric');
        loc.hasGas      = types.has('Gas');
        loc.fuelMix = loc.hasElectric && loc.hasGas ? 'both'
                    : loc.hasElectric              ? 'electric'
                    : loc.hasGas                   ? 'gas' : 'none';

        const anyPart   = loc.accounts.some(a => PARTICIPATING_RE.test(a.status || ''));
        const allInelig = loc.accounts.length > 0 && loc.accounts.every(a => INELIGIBLE_RE.test(a.status || ''));
        loc.combinedStatus = anyPart ? 'participating' : allInelig ? 'ineligible' : 'eligible';
        // Map combinedStatus → existing TYPE_META keys so non-pin code paths still work
        loc.type = loc.combinedStatus === 'participating' ? 'contracted'
                : loc.combinedStatus === 'ineligible'    ? 'other'
                : 'eligible';

        // Combined for benchmarks
        const sqfts = loc.accounts.map(a => Number(a.sqft) || 0).filter(x => x > 0);
        loc.sqft = sqfts.length ? Math.max(...sqfts) : 0;
        let totalKBtu = 0;
        for (const a of loc.accounts) {
          const u = Number(a.usage) || 0;
          if (a.accountType === 'Electric') totalKBtu += u * 3.412;
          else if (a.accountType === 'Gas') totalKBtu += u * 100;
        }
        loc.totalKBtu = totalKBtu;
        out.push(loc);
      }
      return out;
    }



    // Deterministic per-location demo synthesis. Hash the location's
    // identity to seed values so the same pin always shows the same numbers
    // (stable across re-clicks, screenshots, page reloads).
    function _hashLoc(asset) {
      const s = String(asset.id || '') + '|' + String(asset.address || '') + '|' + String(asset.city || '');
      let h = 2166136261; // FNV-1a 32-bit
      for (let i = 0; i < s.length; i++) {
        h ^= s.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      return h >>> 0;
    }

    function demoLocationData(asset) {
      if (!asset) return { sqft: 4500, usage: 80000 };
      const h = _hashLoc(asset);
      const r1 = ((h        ) & 0xFFFF) / 0xFFFF;   // 0..1
      const r2 = ((h >>> 13 ) & 0xFFFF) / 0xFFFF;
      const r3 = ((h >>> 23 ) & 0xFF  ) / 0xFF;

      // Demo sqft: 2,000–8,000 sqft (healthcare clinic / mid-market commercial range)
      const demoSqft = 2000 + Math.round(r1 * 6000);

      // Distribute target EUI across performance bands so tiles show variety:
      //   ~30% top quartile  (50–80 kBtu/sqft → green)
      //   ~50% near median   (80–120 kBtu/sqft → amber/green mix)
      //   ~20% above median  (120–160 kBtu/sqft → red)
      let targetEUI;
      if      (r2 < 0.30) targetEUI = 50  + r3 * 30;
      else if (r2 < 0.80) targetEUI = 80  + r3 * 40;
      else                targetEUI = 120 + r3 * 40;

      // Convert target EUI → annual usage based on fuel
      const isG = asset.accountType === 'Gas';
      const demoUsage = isG
        ? Math.round((targetEUI * demoSqft) / 100)     // kBtu → therms
        : Math.round((targetEUI * demoSqft) / 3.412);  // kBtu → kWh

      return { sqft: demoSqft, usage: demoUsage };
    }

    function locationBenchmarks(asset) {
      if (!asset) return null;

      // Normalize to (accounts list, location sqft). Treat single-account input
      // as a 1-element accounts array for uniform handling downstream.
      const accounts = Array.isArray(asset.accounts) && asset.accounts.length > 0
        ? asset.accounts
        : [asset];
      let sqft = Number(asset.sqft) || 0;

      const state = String(asset.state || '').toUpperCase();
      const stateRate = ((window.STATE_RATES_CENTS || {})[state] || 12.0) / 100;
      const co2Factor = (window.EGRID_KG_PER_KWH || {})[state] || 0.348;
      const btype = PORTFOLIO_BTYPE;

      // Sum across accounts: kBtu, spend, CO2
      let totalKBtu = 0, totalSpend = 0, totalCO2 = 0, anyUsage = false;
      for (const a of accounts) {
        const u = Number(a.usage) || 0;
        if (u <= 0) continue;
        anyUsage = true;
        if (a.accountType === 'Gas') {
          totalKBtu  += u * 100;
          totalSpend += u * 1.10;        // ~$1.10/therm typical commercial
          totalCO2   += u * 5.31;        // EPA AP-42 NG combustion factor
        } else {
          totalKBtu  += u * 3.412;       // kWh × 3.412 = kBtu
          totalSpend += u * stateRate;
          totalCO2   += u * co2Factor;
        }
      }

      // Demo fallback when sqft or usage missing
      let synthesizedSqft  = false;
      let synthesizedUsage = false;
      if (!sqft) {
        const demo = demoLocationData(asset);
        sqft = demo.sqft;
        synthesizedSqft = true;
      }
      if (!anyUsage) {
        const demo = demoLocationData(asset);
        const repType = (accounts[0] && accounts[0].accountType) || 'Electric';
        if (repType === 'Gas') {
          totalKBtu  = demo.usage * 100;
          totalSpend = demo.usage * 1.10;
          totalCO2   = demo.usage * 5.31;
        } else {
          totalKBtu  = demo.usage * 3.412;
          totalSpend = demo.usage * stateRate;
          totalCO2   = demo.usage * co2Factor;
        }
        synthesizedUsage = true;
      }

      const actualEUI    = totalKBtu / sqft;
      const costPerSqft  = totalSpend / sqft;
      const co2PerSqft   = totalCO2 / sqft;

      // Median EUI from CBECS (regional + size adjustments)
      const baseMedian = (window.CBECS_MEDIANS || {})[btype] || 80;
      const regionAdj  = (window.REGION_ADJ_BY_STATE || {})[state] || 1.0;
      const sizeAdjFn  = window.sizeAdj || function(){ return 1.0; };
      const medianEUI  = baseMedian * regionAdj * sizeAdjFn(sqft);

      // Percentile (sigma ≈ 30% of median)
      const sigma = medianEUI * 0.30;
      let percentile = Math.round(50 + ((actualEUI - medianEUI) / sigma) * 25);
      percentile = Math.max(1, Math.min(99, percentile));
      const essScore = Math.max(1, Math.min(100, Math.round(100 - percentile)));

      // Verdict color (used for EUI tile big-number)
      let verdictColor;
      if (actualEUI < medianEUI * 0.85)      verdictColor = '#22c55e';
      else if (actualEUI < medianEUI * 1.15) verdictColor = '#f59e0b';
      else                                    verdictColor = '#ef4444';

      // Cost color: vs portfolio expected
      const expectedCostPerSqft = medianEUI * (stateRate / 3.412);
      const costDelta = (costPerSqft / Math.max(expectedCostPerSqft, 0.001) - 1) * 100;
      const costColor = costDelta < -5 ? '#22c55e' : costDelta < 5 ? '#f59e0b' : '#ef4444';

      // ESS color
      const essColor = essScore >= 75 ? '#22c55e' : essScore >= 50 ? '#f59e0b' : '#ef4444';

      // Carbon color: vs grid average
      const gridAvgCO2PerSqft = (medianEUI * 0.7 / 3.412) * co2Factor;
      const carbonDelta = (co2PerSqft / Math.max(gridAvgCO2PerSqft, 0.01) - 1) * 100;
      const carbonColor = carbonDelta < -10 ? '#22c55e' : carbonDelta < 10 ? '#f59e0b' : '#ef4444';

      return {
        insufficient: false,
        estimated: synthesizedSqft || synthesizedUsage,
        estimatedFields: [synthesizedSqft && 'sq ft', synthesizedUsage && 'usage'].filter(Boolean),
        actualEUI: Math.round(actualEUI),
        medianEUI: Math.round(medianEUI),
        verdictColor,
        essScore, essColor,
        costPerSqft: costPerSqft.toFixed(2),
        costColor,
        co2PerSqft: co2PerSqft.toFixed(1),
        carbonColor,
        certifiable: essScore >= 75,
      };
    }


    /* ============================================================
       TopoJSON → GeoJSON (minimal inline decoder)
       ============================================================ */
    function topoToGeo(topo, objectName) {
      const obj = topo.objects[objectName];
      if (!obj) return null;
      const t = topo.transform || { scale: [1, 1], translate: [0, 0] };
      const arcs = topo.arcs.map(arc => {
        let x = 0, y = 0;
        return arc.map(([dx, dy]) => {
          x += dx; y += dy;
          return [x * t.scale[0] + t.translate[0], y * t.scale[1] + t.translate[1]];
        });
      });
      const arcCoords = (idx) => idx < 0 ? arcs[~idx].slice().reverse() : arcs[idx];
      const ring = (indices) => {
        const out = [];
        for (let i = 0; i < indices.length; i++) {
          let pts = arcCoords(indices[i]);
          if (i > 0) pts = pts.slice(1);
          for (const p of pts) out.push(p);
        }
        return out;
      };
      const coords = (g) => {
        if (g.type === 'Polygon') return g.arcs.map(ring);
        if (g.type === 'MultiPolygon') return g.arcs.map(p => p.map(ring));
        return null;
      };
      return {
        type: 'FeatureCollection',
        features: obj.geometries.map(g => ({
          type: 'Feature',
          id: g.id,
          properties: g.properties || {},
          geometry: { type: g.type, coordinates: coords(g) },
        })),
      };
    }

    const STATE_BY_CODE = Object.fromEntries(STATE_INFO.map(s => [s[0], s]));
    const STATE_BY_NAME = Object.fromEntries(STATE_INFO.map(s => [s[1].toLowerCase(), s]));

    const norm = s => (s || '').trim().toLowerCase().replace(/\bst\.\s*/g, 'saint ').replace(/\s+/g, ' ');

    function resolveState(input) {
      if (!input) return null;
      const k = input.trim().toUpperCase();
      if (STATE_BY_CODE[k]) return STATE_BY_CODE[k];
      const byName = STATE_BY_NAME[input.trim().toLowerCase()];
      return byName || null;
    }

    function searchCities(query, limit = 8) {
      if (!query) return [];
      const q = query.trim();
      let cityPart = q, statePart = '';
      if (q.includes(',')) {
        const [a, b] = q.split(',').map(s => s.trim());
        cityPart = a; statePart = b || '';
      } else {
        const parts = q.split(/\s+/);
        if (parts.length >= 2) {
          const last = parts[parts.length - 1];
          if (resolveState(last) || resolveState(parts.slice(-2).join(' '))) {
            statePart = resolveState(parts.slice(-2).join(' ')) ? parts.slice(-2).join(' ') : last;
            cityPart = q.slice(0, q.length - statePart.length).trim();
          }
        }
      }
      const cityN = norm(cityPart);
      const stateInfo = statePart ? resolveState(statePart) : null;
      const stateCode = stateInfo ? stateInfo[0] : null;
      const results = [];
      for (const [city, code, lat, lng] of CITIES) {
        if (stateCode && code !== stateCode) continue;
        const cn = norm(city);
        if (cn.startsWith(cityN) || cn.includes(cityN)) {
          results.push({ city, state: code, lat, lng, score: cn === cityN ? 0 : (cn.startsWith(cityN) ? 1 : 2) });
          if (results.length > 60) break;
        }
      }
      results.sort((a, b) => a.score - b.score);
      return results.slice(0, limit);
    }

    function geocode(query) {
      const r = searchCities(query, 1);
      if (r.length) return { ...r[0], approximate: false };
      const parts = query.split(',').map(s => s.trim());
      for (const p of parts.reverse()) {
        const s = resolveState(p);
        if (s) return { city: parts.join(', '), state: s[0], lat: s[2], lng: s[3], approximate: true };
      }
      return null;
    }

    /* ============================================================
       US MAP
       ============================================================ */
    function USMap({ assets, hoveredId, setHoveredId, selectedId, setSelectedId, selectedClusterKey, setSelectedClusterKey }) {
      const [geo, setGeo] = useState(null);
      const [size, setSize] = useState({ w: 1000, h: 600 });
      const [status, setStatus] = useState('loading'); // loading | ok | fallback
      const wrapRef = useRef(null);

      useEffect(() => {
        let cancelled = false;
        // Try jsdelivr first (most reliable CORS), then unpkg, then a github mirror
        const tryFetch = async () => {
          const sources = [
            { url: 'https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json', topo: true },
            { url: 'https://unpkg.com/us-atlas@3/states-10m.json',           topo: true },
            { url: 'https://cdn.jsdelivr.net/npm/us-atlas@2/us/states-10m.json', topo: true },
          ];
          for (const src of sources) {
            try {
              const r = await fetch(src.url);
              if (!r.ok) continue;
              const data = await r.json();
              if (cancelled) return;
              if (src.topo) {
                const geo = topoToGeo(data, 'states');
                if (geo && geo.features.length > 5) {
                  setGeo(geo); setStatus('ok'); return;
                }
              } else {
                setGeo(data); setStatus('ok'); return;
              }
            } catch (e) { /* next */ }
          }
          if (!cancelled) setStatus('fallback');
        };
        tryFetch();
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        if (!wrapRef.current) return;
        const ro = new ResizeObserver(entries => {
          const e = entries[0];
          if (!e) return;
          const w = Math.max(400, e.contentRect.width);
          setSize({ w, h: Math.round(w * 0.6) });
        });
        ro.observe(wrapRef.current);
        return () => ro.disconnect();
      }, []);

      const projection = useMemo(() => {
        return d3.geoAlbersUsa().scale(size.w * 1.25).translate([size.w / 2, size.h / 2]);
      }, [size.w, size.h]);
      const pathGen = useMemo(() => d3.geoPath(projection), [projection]);

      const pinPositions = useMemo(() => {
        return assets.map(a => {
          const p = projection([a.lng, a.lat]);
          return p ? { ...a, x: p[0], y: p[1] } : null;
        }).filter(Boolean);
      }, [assets, projection]);

      // group pins by city+state into clusters
      const clusters = useMemo(() => {
        const TYPE_PRIORITY = { employee: 0, partner: 1, contractor: 2 };
        const map = new Map();
        for (const p of pinPositions) {
          const key = `${p.city}|${p.state}`;
          if (!map.has(key)) {
            map.set(key, { key, city: p.city, state: p.state, x: p.x, y: p.y, assets: [] });
          }
          map.get(key).assets.push(p);
        }
        const out = [];
        for (const cl of map.values()) {
          const counts = {};
          for (const a of cl.assets) counts[a.type] = (counts[a.type] || 0) + 1;
          // Dominant fuel: if all members share one fuelMix, use it; otherwise 'both'
          const fuelCounts = cl.assets.reduce((acc, a) => {
            const m = a.fuelMix || 'none';
            acc[m] = (acc[m] || 0) + 1;
            return acc;
          }, {});
          const fuelKeys = Object.keys(fuelCounts);
          cl.dominantFuel = fuelKeys.length === 1 ? fuelKeys[0]
                         : (fuelKeys.includes('both') || (fuelKeys.includes('electric') && fuelKeys.includes('gas')))
                            ? 'both'
                            : fuelKeys[0];
          cl.dominantType = Object.entries(counts)
            .sort((a, b) => b[1] - a[1] || TYPE_PRIORITY[a[0]] - TYPE_PRIORITY[b[0]])[0][0];
          cl.typeCounts = counts;
          cl.isMixed = Object.keys(counts).length > 1;
          out.push(cl);
        }
        return out;
      }, [pinPositions]);

      const hoveredCluster = useMemo(() => {
        if (!hoveredId) return null;
        return clusters.find(cl => cl.assets.some(a => a.id === hoveredId)) || null;
      }, [hoveredId, clusters]);

      // fallback: draw simple circles at state centroids if no geo data loaded
      const fallbackStates = useMemo(() => {
        if (status !== 'fallback') return null;
        return STATE_INFO.map(([code, name, lat, lng]) => {
          const p = projection([lng, lat]);
          return p ? { code, name, x: p[0], y: p[1] } : null;
        }).filter(Boolean);
      }, [status, projection]);

      return (
        <div ref={wrapRef} className="relative w-full" style={{ minHeight: 380 }}>
          <div className="absolute inset-0 rounded-2xl pointer-events-none"
            style={{
              background: `radial-gradient(circle at 30% 20%, #0a1d36 0%, #050b16 70%)`,
              boxShadow: `inset 0 0 120px rgba(0,0,0,0.55)`,
            }} />
          <div className="absolute inset-0 rounded-2xl pointer-events-none"
            style={{
              opacity: 0.16,
              backgroundImage:
                `linear-gradient(${C.borderSoft} 1px, transparent 1px),
                 linear-gradient(90deg, ${C.borderSoft} 1px, transparent 1px)`,
              backgroundSize: '32px 32px',
            }} />

          <svg viewBox={`0 0 ${size.w} ${size.h}`} width="100%" height="100%"
            className="relative block"
            style={{ filter: 'drop-shadow(0 0 60px rgba(0, 212, 255, 0.06))' }}>
            <defs>
              <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#1d3a64" />
                <stop offset="100%" stopColor="#0f1e36" />
              </linearGradient>
              <filter id="pinGlow" x="-200%" y="-200%" width="500%" height="500%">
                <feGaussianBlur stdDeviation="3.5" />
              </filter>
              <filter id="strongGlow" x="-200%" y="-200%" width="500%" height="500%">
                <feGaussianBlur stdDeviation="6" />
              </filter>
            </defs>

            {/* primary: real state outlines */}
            {status === 'ok' && geo && geo.features.map((f, i) => (
              <path key={i} d={pathGen(f) || ''}
                fill="url(#landGrad)" stroke={C.landStroke} strokeWidth={0.8}
                style={{ transition: 'fill 200ms ease' }} />
            ))}

            {/* fallback: state hex/dots at centroids */}
            {status === 'fallback' && fallbackStates && fallbackStates.map((s) => (
              <g key={s.code}>
                <circle cx={s.x} cy={s.y} r={size.w * 0.022} fill="url(#landGrad)" stroke={C.landStroke} strokeWidth={0.8} />
                <text x={s.x} y={s.y + 4} textAnchor="middle"
                  fill={C.textMuted} fontFamily="'IBM Plex Mono', monospace"
                  fontSize={Math.max(10, size.w * 0.011)} fontWeight="600" letterSpacing="0.5">
                  {s.code}
                </text>
              </g>
            ))}

            {status === 'loading' && (
              <text x={size.w / 2} y={size.h / 2} textAnchor="middle"
                fill={C.textDim} fontFamily="'IBM Plex Mono', monospace" fontSize="12" letterSpacing="2">
                LOADING TERRITORY…
              </text>
            )}

            {/* connector lines from geographic center to each cluster */}
            {clusters.length > 0 && (() => {
              const cx = projection([-98.5795, 39.8283]);
              if (!cx) return null;
              return (
                <g opacity="0.25">
                  {clusters.map(cl => (
                    <line key={`l${cl.key}`} x1={cx[0]} y1={cx[1]} x2={cl.x} y2={cl.y}
                      stroke={(FUEL_META[cl.dominantFuel] || TYPE_META[cl.dominantType]).color} strokeWidth={0.6} strokeDasharray="2 4" />
                  ))}
                  <circle cx={cx[0]} cy={cx[1]} r={3} fill={C.text} opacity={0.5} />
                </g>
              );
            })()}

            {/* CLUSTER PINS — size scales with asset count, count shown for n>1 */}
            {clusters.map((cl) => {
              const n = cl.assets.length;
              const meta = FUEL_META[cl.dominantFuel] || TYPE_META[cl.dominantType];
              const isHover = cl.assets.some(a => a.id === hoveredId);
              const isSelected =
                cl.assets.some(a => a.id === selectedId) ||
                selectedClusterKey === cl.key;
              const active = isHover || isSelected;

              // size grows with asset count, capped
              const crispR = 6 + Math.min(Math.sqrt(n - 1) * 2.5, 10);
              const outerR = crispR * 1.4;
              const haloR  = crispR * 1.85;
              const ringR  = crispR * 2.3;
              const fontSize = Math.max(10, Math.min(Math.round(crispR * 1.25), 16));

              const onClickPin = (e) => {
                e.stopPropagation();
                if (n === 1) setSelectedId(cl.assets[0].id);
                else setSelectedClusterKey(cl.key);
              };
              // hover the first asset in the cluster (drives the tooltip / list highlight)
              const onEnter = () => setHoveredId(cl.assets[0].id);
              const onLeave = () => setHoveredId(null);

              return (
                <g key={cl.key}
                  transform={`translate(${cl.x},${cl.y})`}
                  style={{ cursor: 'pointer' }}
                  onMouseEnter={onEnter}
                  onMouseLeave={onLeave}
                  onClick={onClickPin}>

                  {/* selection ring */}
                  {isSelected && (
                    <circle r={ringR + 4} fill="none" stroke={meta.color} strokeWidth={1.5}
                      opacity={0.7} strokeDasharray="3 3" />
                  )}
                  {/* outer ring */}
                  <circle r={active ? ringR + 2 : ringR} fill={meta.color} opacity={0.18} filter="url(#strongGlow)" />
                  {/* halo */}
                  <circle r={active ? haloR + 2 : haloR} fill={meta.color} opacity={0.32} filter="url(#strongGlow)" />
                  {/* outer pin glow */}
                  <circle r={active ? outerR + 2 : outerR} fill={meta.color} filter="url(#pinGlow)" opacity={0.9} />
                  {/* crisp pin */}
                  <circle r={active ? crispR + 1.5 : crispR} fill={meta.color} stroke="white" strokeWidth={1.5} />

                  {/* center: count if cluster, white dot if single */}
                  {n > 1 ? (
                    <text x={0} y={0} textAnchor="middle" dominantBaseline="central"
                      fill="white" fontFamily="'IBM Plex Mono', monospace" fontWeight="700"
                      fontSize={fontSize}
                      style={{ pointerEvents: 'none', userSelect: 'none' }}>
                      {n}
                    </text>
                  ) : (
                    <circle r={(active ? crispR + 1.5 : crispR) * 0.4} fill="white" />
                  )}
                </g>
              );
            })}

            {/* hover tooltip */}
            {hoveredCluster && (() => {
              const meta = FUEL_META[hoveredCluster.dominantFuel] || TYPE_META[hoveredCluster.dominantType];
              const n = hoveredCluster.assets.length;
              const isCluster = n > 1;
              const w = 230, h = 76;
              const tx = Math.min(Math.max(hoveredCluster.x + 16, 10), size.w - w - 10);
              const ty = Math.max(hoveredCluster.y - h - 12, 10);
              const title = isCluster
                ? `${hoveredCluster.city}, ${hoveredCluster.state}`
                : (hoveredCluster.assets[0].name || meta.label);
              const sub = isCluster
                ? `${n} ASSETS · CLICK TO VIEW`
                : meta.label.toUpperCase();
              const detail = isCluster
                ? hoveredCluster.assets.map(a => TYPE_META[a.type].label).join(' · ')
                : `${hoveredCluster.assets[0].city}, ${hoveredCluster.assets[0].state}`;
              return (
                <g transform={`translate(${tx},${ty})`} style={{ pointerEvents: 'none' }}>
                  <rect width={w} height={h} rx={10} fill={C.panelSolid} stroke={meta.color} strokeWidth={1.2} />
                  <rect x={0} y={0} width={4} height={h} fill={meta.color} rx={2} />
                  <text x={14} y={24} fill={C.text} fontFamily="'IBM Plex Sans', sans-serif" fontSize="14" fontWeight="600">
                    {title}
                  </text>
                  <text x={14} y={44} fill={meta.color} fontFamily="'IBM Plex Mono', monospace" fontSize="10" letterSpacing="2" fontWeight="600">
                    {sub}
                  </text>
                  <text x={14} y={62} fill={C.textMuted} fontFamily="'IBM Plex Sans', sans-serif" fontSize="11">
                    {detail.length > 32 ? detail.slice(0, 32) + '…' : detail}
                  </text>
                </g>
              );
            })()}
          </svg>

          {/* corner overlay labels — includes the type legend that used to live
              in the page header above the map. Counts are computed inline from
              the `assets` prop so they stay in sync with filters. */}
          <div className="absolute top-3 left-4 flex items-center gap-3 pointer-events-none flex-wrap"
            style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
            <span style={{ color: C.accent, fontSize: 10, letterSpacing: 3 }}>● LIVE</span>
            <span style={{ color: C.textDim, fontSize: 10, letterSpacing: 3 }}>PORTFOLIO MAP</span>
            {status === 'fallback' && (
              <span style={{ color: C.textMuted, fontSize: 9, letterSpacing: 2 }}>· schematic mode</span>
            )}
            <span style={{ color: C.border, fontSize: 12, marginLeft: 6, marginRight: 2 }}>│</span>
            {Object.entries(TYPE_META).map(([k, meta]) => {
              const n = assets.filter(a => a.type === k).length;
              return (
                <span key={k} className="flex items-center" style={{ gap: 6 }}>
                  <span className="inline-block rounded-full" style={{ width: 8, height: 8, background: meta.color, boxShadow: `0 0 8px ${meta.color}` }} />
                  <span style={{ fontSize: 10, letterSpacing: 1.5, color: C.textMuted }}>
                    {meta.label}<span style={{ color: C.text, marginLeft: 4 }}>{n}</span>
                  </span>
                </span>
              );
            })}
          </div>
          <div className="absolute top-3 right-4 pointer-events-none text-right"
            style={{ fontFamily: "'IBM Plex Mono', monospace" }}>
            <div style={{ color: C.textDim, fontSize: 9, letterSpacing: 2 }}>LOCATIONS</div>
            <div style={{ color: C.text, fontSize: 24, fontWeight: 600, letterSpacing: 1, lineHeight: 1 }}>
              {String(assets.length).padStart(3, '0')}
            </div>
          </div>
        </div>
      );
    }

    function AddAssetForm({ onAdd }) {
      const [name, setName] = useState('');
      const [company, setCompany] = useState('');
      const [type, setType] = useState('eligible');
      const [location, setLocation] = useState('');
      const [address, setAddress] = useState('');
      const [notes, setNotes] = useState('');
      const [accountType, setAccountType] = useState('Electric');
      const [zip, setZip] = useState('');
      const [sqft, setSqft] = useState('');
      const [storeCode, setStoreCode] = useState('');
      const [supplier, setSupplier] = useState('');
      const [accountNum, setAccountNum] = useState('');
      const [usage, setUsage] = useState('');
      const [contract, setContract] = useState('');
      const [exp, setExp] = useState('');
      const [suggestions, setSuggestions] = useState([]);
      const [showSugg, setShowSugg] = useState(false);
      const [error, setError] = useState('');
      const [highlight, setHighlight] = useState(0);
      const inputRef = useRef(null);

      useEffect(() => {
        if (location.trim().length < 1) { setSuggestions([]); return; }
        setSuggestions(searchCities(location, 6));
        setHighlight(0);
      }, [location]);

      const pick = (s) => { setLocation(`${s.city}, ${s.state}`); setShowSugg(false); };

      const submit = () => {
        if (!name.trim()) { setError('Name is required.'); return; }
        if (!location.trim()) { setError('Location is required.'); return; }
        const g = geocode(location);
        if (!g) { setError("Couldn't find that location. Try \"City, ST\"."); return; }
        const statusFromType = { eligible: 'Eligible', contracted: 'Contracted', other: 'Ineligible' };
        const usageNum = usage.trim() === '' ? undefined : Number(usage);
        const sqftNum  = sqft.trim()  === '' ? undefined : Number(sqft);
        onAdd({
          id: Date.now() + Math.random(),
          name: name.trim(),
          company: company.trim(),
          utility: company.trim(),
          supplier: supplier.trim(),
          accountType,
          status: statusFromType[type] || '',
          type,
          city: g.city, state: g.state,
          address: name.trim(),
          zip: zip.trim(),
          sqft: sqftNum,
          storeCode: storeCode.trim(),
          account: accountNum.trim(),
          usage: usageNum,
          contract: contract.trim(),
          exp: exp.trim(),
          notes: notes.trim(),
          lat: g.lat,
          lng: g.lng,
          approximate: g.approximate,
          _fresh: true,
        });
        setName(''); setCompany(''); setLocation(''); setAddress(''); setNotes('');
        setZip(''); setAccountNum(''); setUsage(''); setContract(''); setExp('');
        setSqft(''); setStoreCode(''); setSupplier(''); setError('');
        inputRef.current?.focus();

      return (
        <div className="space-y-3">
          <div className="flex items-baseline justify-between">

            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: C.textDim, letterSpacing: 2 }}>/ADD</span>
          </div>

          <div className="grid grid-cols-3 gap-2">
            {Object.entries(TYPE_META).map(([k, meta]) => {
              const Ico = meta.Icon;
              const active = type === k;
              return (
                <button key={k} onClick={() => setType(k)}
                  className="flex flex-col items-center justify-center gap-1.5 py-3 rounded-lg transition-all"
                  style={{
                    background: active ? `${meta.color}25` : 'rgba(255,255,255,0.02)',
                    border: `1px solid ${active ? meta.color : C.border}`,
                    color: active ? meta.color : C.textMuted,
                    boxShadow: active ? `0 0 16px ${meta.color}33` : 'none',
                  }}>
                  <Ico size={18} />
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: 1.5 }}>
                    {meta.label.toUpperCase()}
                  </span>
                </button>
              );
            })}
          </div>

          <div className="grid grid-cols-2 gap-2">
            {[['Electric', '#22c55e'], ['Gas', '#3B82F6']].map(([k, color]) => {
              const active = accountType === k;
              return (
                <button key={k} onClick={() => setAccountType(k)}

                  style={{
                    background: active ? color + '25' : 'rgba(255,255,255,0.02)',
                    border: '1px solid ' + (active ? color : C.border),
                    color: active ? color : C.textMuted,
                    boxShadow: active ? '0 0 16px ' + color + '33' : 'none',

              className="w-full mt-1 px-3 py-2.5 rounded-lg outline-none transition-all"
              style={{ background: 'rgba(255,255,255,0.03)', border: `1px solid ${C.border}`, color: C.text,
                fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14 }}
              onFocus={(e) => e.target.style.borderColor = C.accent}
              onBlur={(e) => e.target.style.borderColor = C.border} />
          </div>

          <div>
            <label style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 9, letterSpacing: 2, color: C.textDim }}>SQUARE FEET <span style={{ color: C.textDim, opacity: 0.6 }}>(optional)</span></label>

    /* ============================================================
       LIST
       ============================================================ */
    function MatchedLocationsList({ assets, hoveredId, setHoveredId, setSelectedId, hasActiveFilters, filters, setFilters, allLocations }) {
      // When state filter is "all", show state-count tiles instead of a long
      // address list — at portfolio scale (hundreds of locations) the list
      // is unreadable. Click a tile → filter to that state → list appears.
      // Uses unfiltered allLocations for state counts so other filters
      // (search query, type, status) don't shrink the universe.
      if (filters && filters.state === 'all' && allLocations && allLocations.length > 0) {
        // Group by state and count
        const byState = {};
        allLocations.forEach(a => {
          const st = String(a.state || '—').toUpperCase().trim() || '—';
          byState[st] = (byState[st] || 0) + 1;
        });
        const sortedStates = Object.keys(byState).sort((a, b) => byState[b] - byState[a]);

        return (
          <div className="rounded-2xl" style={{
            background: C.panelSolid, border: '1px solid ' + C.border,
            padding: '14px 14px 12px 14px',
          }}>
            <div className="flex items-baseline justify-between" style={{ marginBottom: 12, paddingLeft: 4, paddingRight: 4 }}>
              <h3 style={{
                fontFamily: "'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif",
                fontSize: 12, fontWeight: 700, letterSpacing: 3,
                color: C.text, textTransform: 'uppercase',
              }}>
                Locations by State
              </h3>
              <span style={{
                fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
                color: C.textDim, letterSpacing: 1.5,
              }}>
                {sortedStates.length} {sortedStates.length === 1 ? 'STATE' : 'STATES'} · {allLocations.length} TOTAL
              </span>
            </div>
            <div style={{
              display: 'grid',
              gridTemplateColumns: 'repeat(auto-fill, minmax(140px, 1fr))',
              gap: 8,
              paddingRight: 4,
            }}>
              {sortedStates.map(st => (
                <button
                  key={st}
                  type="button"
                  onClick={() => setFilters && setFilters(Object.assign({}, filters, { state: st }))}
                  className="flex items-center justify-between gap-2 px-3 py-2.5 rounded-lg cursor-pointer transition-all"
                  style={{
                    background: 'rgba(173,213,64,0.06)',
                    border: '1px solid rgba(173,213,64,0.22)',
                    color: C.text,
                    fontFamily: 'inherit',
                  }}
                  onMouseEnter={e => {
                    e.currentTarget.style.background = 'rgba(173,213,64,0.14)';
                    e.currentTarget.style.borderColor = 'rgba(173,213,64,0.55)';
                  }}
                  onMouseLeave={e => {
                    e.currentTarget.style.background = 'rgba(173,213,64,0.06)';
                    e.currentTarget.style.borderColor = 'rgba(173,213,64,0.22)';
                  }}>
                  <span style={{
                    fontFamily: "'IBM Plex Mono', monospace",
                    fontSize: 12, fontWeight: 700, color: C.text,
                    letterSpacing: 1.5,
                  }}>{st}</span>
                  <span className="flex items-baseline" style={{ gap: 4 }}>
                    <span style={{
                      fontFamily: "'IBM Plex Sans Condensed', sans-serif",
                      fontSize: 16, fontWeight: 700, color: C.accent,
                      lineHeight: 1,
                    }}>{byState[st]}</span>
                    <span style={{
                      fontSize: 9.5, color: C.textMuted,
                      letterSpacing: 0.5,
                    }}>{byState[st] === 1 ? 'loc' : 'locs'}</span>
                  </span>
                </button>
              ))}
            </div>
          </div>
        );
      }

      const fuelColor = (a) => {
        // Location records carry fuelMix; legacy account records carry accountType.
        if (a.fuelMix) return (FUEL_META[a.fuelMix] || FUEL_META.none).color;
        return a.accountType === 'Electric' ? '#22c55e' : a.accountType === 'Gas' ? '#3B82F6' : C.textMuted;
      };
      const fuelIcon = (a) => {
        if (a.hasElectric && a.hasGas) return '⚡🔥';
        if (a.hasElectric || a.accountType === 'Electric') return '⚡';
        if (a.hasGas      || a.accountType === 'Gas')      return '🔥';
        return '◆';
      };

      // Status pill: lime if participating, amber if eligible-active, dim otherwise
      const statusPill = (status) => {
        const s = String(status || '').toLowerCase();
        const isPart   = /(particip|enroll|active|approv|signed|contract)/.test(s);
        const isInelig = /(inelig|n\/a|deregul|exclud|not\s*available|not\s*elig)/.test(s);
        let bg, fg;
        if (isPart)        { bg = '#add54022'; fg = '#add540'; }
        else if (isInelig) { bg = 'rgba(255,255,255,0.04)'; fg = C.textDim; }
        else               { bg = '#3B82F622'; fg = '#3B82F6'; }
        return { bg, fg, label: status || '—' };
      };

      // Empty state when there are no matches
      if (assets.length === 0) {
        return (
          <div className="rounded-2xl p-6" style={{
            background: C.panelSolid, border: '1px dashed ' + C.border,
            textAlign: 'center', color: C.textDim,
            fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5,
          }}>
            {hasActiveFilters
              ? 'No locations match these filters. Adjust the bar above to see results.'
              : 'No locations in this portfolio yet.'}
          </div>
        );
      }

      // Sort: state, then city, then name — so users browse predictably
      const sorted = [...assets].sort((a, b) => {
        const sa = String(a.state || '').toUpperCase();
        const sb = String(b.state || '').toUpperCase();
        if (sa !== sb) return sa < sb ? -1 : 1;
        const ca = String(a.city || '').toLowerCase();
        const cb = String(b.city || '').toLowerCase();
        if (ca !== cb) return ca < cb ? -1 : 1;
        return String(a.name || '').toLowerCase() < String(b.name || '').toLowerCase() ? -1 : 1;
      });

      return (
        <div className="rounded-2xl" style={{
          background: C.panelSolid, border: '1px solid ' + C.border,
          padding: '14px 14px 10px 14px',
        }}>
          <div className="flex items-baseline justify-between" style={{ marginBottom: 10, paddingLeft: 4, paddingRight: 4 }}>
            <h3 style={{
              fontFamily: "'IBM Plex Sans Condensed', 'IBM Plex Sans', sans-serif",
              fontSize: 12, fontWeight: 700, letterSpacing: 3,
              color: C.text, textTransform: 'uppercase',
            }}>
              {hasActiveFilters ? 'Matched Locations' : 'All Locations'}
            </h3>
            <span style={{
              fontFamily: "'IBM Plex Mono', monospace", fontSize: 10,
              color: C.textDim, letterSpacing: 1.5,
            }}>
              {String(assets.length).padStart(2, '0')} {assets.length === 1 ? 'ENTRY' : 'ENTRIES'}
            </span>
          </div>

          <div style={{
            maxHeight: 360, overflowY: 'auto',
            display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(320px, 1fr))',
            gap: 6, paddingRight: 4,
            scrollbarWidth: 'thin',
          }}>
            {sorted.map(a => {
              const active = hoveredId === a.id;
              const fc = fuelColor(a);
              const fi = fuelIcon(a);
              const sp = a.combinedStatus
                ? (a.combinedStatus === 'participating' ? { bg: '#add54022', fg: '#add540', label: 'Participating' }
                  : a.combinedStatus === 'ineligible'  ? { bg: 'rgba(255,255,255,0.04)', fg: C.textDim, label: 'Ineligible' }
                  : { bg: '#3B82F622', fg: '#3B82F6', label: 'Eligible' })
                : statusPill(a.status);
              return (
                <div key={a.id}
                  onMouseEnter={() => setHoveredId(a.id)}
                  onMouseLeave={() => setHoveredId(null)}
                  onClick={() => setSelectedId(a.id)}
                  className="flex items-center gap-2.5 px-2.5 py-2 rounded-lg cursor-pointer transition-all"
                  style={{
                    background: active ? fc + '14' : 'rgba(255,255,255,0.02)',
                    border: '1px solid ' + (active ? fc : C.border),
                    boxShadow: active ? '0 0 14px ' + fc + '22' : 'none',
                  }}>
                  <div className="flex items-center justify-center flex-shrink-0"
                    style={{
                      minWidth: 26, height: 26, borderRadius: 6,
                      padding: '0 6px',
                      background: fc + '22', color: fc,
                      fontSize: 12, lineHeight: 1, letterSpacing: -1,
                      boxShadow: 'inset 0 0 6px ' + fc + '33',
                    }}>
                    {fi}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="truncate" style={{
                      color: C.text, fontFamily: "'IBM Plex Sans', sans-serif",
                      fontSize: 12.5, fontWeight: 500,
                    }}>{a.name}</div>
                    <div className="truncate" style={{
                      color: C.textMuted, fontFamily: "'IBM Plex Mono', monospace",
                      fontSize: 9.5, letterSpacing: 0.4, marginTop: 1,
                    }}>{a.city}, {a.state}</div>
                  </div>
                  <span style={{
                    flexShrink: 0,
                    padding: '2px 7px', borderRadius: 4,
                    background: sp.bg, color: sp.fg,
                    fontFamily: "'IBM Plex Mono', monospace",
                    fontSize: 8.5, fontWeight: 700, letterSpacing: 0.5,
                    textTransform: 'uppercase', whiteSpace: 'nowrap',
                    maxWidth: 120, overflow: 'hidden', textOverflow: 'ellipsis',
                  }}>
                    {sp.label}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function SearchFilterBar({ filters, setFilters, stateOptions, totalCount, matchedCount }) {
      const updateFilter = (k, v) => setFilters(Object.assign({}, filters, { [k]: v }));
      const clearFilters = () => setFilters({ q: '', state: 'all', type: 'all', status: 'all' });
      const hasActive = !!filters.q || filters.state !== 'all' || filters.type !== 'all' || filters.status !== 'all';

      const segBtn = (active, color) => ({
        padding: '6px 11px', borderRadius: 6,
        background: active ? (color ? color + '22' : 'rgba(255,255,255,0.10)') : 'transparent',
        border: 'none',
        color: active ? (color || C.text) : C.textMuted,
        fontSize: 10.5, fontWeight: 700, letterSpacing: 1.2,
        fontFamily: "'IBM Plex Mono', monospace",
        cursor: 'pointer', whiteSpace: 'nowrap',
        transition: 'background 0.15s, color 0.15s',
      });
      const segGroupStyle = {
        display: 'flex', gap: 0, padding: 2, borderRadius: 8,
        background: 'rgba(255,255,255,0.025)', border: '1px solid ' + C.border,
      };

      return (
        <div className="rounded-2xl px-4 py-3" style={{
          background: C.panelSolid, border: '1px solid ' + C.border,
          display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap',
        }}>
          {/* Search */}
          <div style={{ flex: '1 1 220px', minWidth: 200, position: 'relative' }}>
            <span style={{
              position: 'absolute', left: 12, top: '50%', transform: 'translateY(-50%)',
              color: C.textDim, fontSize: 14, pointerEvents: 'none',
            }}>🔍</span>
            <input
              value={filters.q}
              onChange={(e) => updateFilter('q', e.target.value)}
              placeholder="Search city, address, store code, utility…"
              style={{
                width: '100%', padding: '8px 12px 8px 36px', borderRadius: 8,
                background: 'rgba(255,255,255,0.04)', border: '1px solid ' + (filters.q ? C.accent : C.border),
                color: C.text, fontSize: 13, fontFamily: "'IBM Plex Sans', sans-serif",
                outline: 'none', transition: 'border-color 0.15s',
              }}
              onFocus={(e) => { e.target.style.borderColor = C.accent; }}
              onBlur={(e) => { if (!filters.q) e.target.style.borderColor = C.border; }}
            />
          </div>

          {/* State dropdown */}
          <select
            value={filters.state}
            onChange={(e) => updateFilter('state', e.target.value)}
            style={{
              background: filters.state !== 'all' ? C.accent + '15' : 'rgba(255,255,255,0.04)',
              border: '1px solid ' + (filters.state !== 'all' ? C.accent : C.border),
              color: filters.state !== 'all' ? C.accent : C.text,
              padding: '8px 28px 8px 12px', borderRadius: 8,
              fontSize: 11, fontWeight: 700, letterSpacing: 1.2,
              fontFamily: "'IBM Plex Mono', monospace",
              cursor: 'pointer', outline: 'none', appearance: 'none',
              backgroundImage: 'url("data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'10\' height=\'10\' viewBox=\'0 0 10 10\' fill=\'%2390a4b8\'><path d=\'M5 7L1 3h8z\'/></svg>")',
              backgroundRepeat: 'no-repeat', backgroundPosition: 'right 10px center',
            }}>
            <option value="all">ALL STATES</option>
            {stateOptions.map(function(s){ return <option key={s} value={s}>{s}</option>; })}
          </select>

          {/* Account type segmented control */}
          <div style={segGroupStyle}>
            <button onClick={() => updateFilter('type', 'all')}      style={segBtn(filters.type === 'all', null)}>ALL FUEL</button>
            <button onClick={() => updateFilter('type', 'electric')} style={segBtn(filters.type === 'electric', '#22c55e')}>⚡ ELEC</button>
            <button onClick={() => updateFilter('type', 'gas')}      style={segBtn(filters.type === 'gas', '#3B82F6')}>🔥 GAS</button>
          </div>

          {/* Participation status segmented control */}
          <div style={segGroupStyle}>
            <button onClick={() => updateFilter('status', 'all')}           style={segBtn(filters.status === 'all', null)}>ALL STATUS</button>
            <button onClick={() => updateFilter('status', 'participating')} style={segBtn(filters.status === 'participating', '#add540')}>● PARTICIPATING</button>
            <button onClick={() => updateFilter('status', 'eligible')}      style={segBtn(filters.status === 'eligible', '#3B82F6')}>○ ELIGIBLE</button>
          </div>

          {/* Counter + Clear */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginLeft: 'auto' }}>
            <span style={{
              fontFamily: "'IBM Plex Mono', monospace", fontSize: 11, letterSpacing: 1.5,
              color: matchedCount === totalCount ? C.textDim : C.text,
              fontWeight: 700,
            }}>
              <span style={{ color: hasActive ? C.accent : C.text }}>{String(matchedCount).padStart(2,'0')}</span>
              <span style={{ color: C.textDim }}> / {String(totalCount).padStart(2,'0')}</span>
            </span>
            {hasActive && (
              <button
                onClick={clearFilters}
                style={{
                  padding: '6px 11px', borderRadius: 6,
                  background: 'transparent', border: '1px solid ' + C.border,
                  color: C.textMuted, fontSize: 10.5, fontWeight: 700, letterSpacing: 1.2,
                  fontFamily: "'IBM Plex Mono', monospace", cursor: 'pointer',
                }}
                onMouseEnter={(e) => { e.currentTarget.style.color = C.accent; e.currentTarget.style.borderColor = C.accent; }}
                onMouseLeave={(e) => { e.currentTarget.style.color = C.textMuted; e.currentTarget.style.borderColor = C.border; }}>
                CLEAR
              </button>
            )}
          </div>
        </div>
      );
    }

                      boxShadow: `inset 0 0 8px ${meta.color}33` }}>

                      color: C.text, fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, fontWeight: 500,

    /* ============================================================
       CLUSTER LIST — opens when a multi-asset pin is clicked

        const onKey = (e) => { if (e.key === 'Escape') onClose(); };

        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      if (!cluster) return null;
      const n = cluster.assets.length;
      const counts = cluster.assets.reduce((acc, a) => { acc[a.type] = (acc[a.type] || 0) + 1; return acc; }, {});
      // pick accent color: if all same type, use it; else use orange
      const sameType = Object.keys(counts).length === 1;
      const accent = sameType ? TYPE_META[Object.keys(counts)[0]].color : C.accent;

      return (
        <>
          <div onClick={onClose}
            style={{
              position: 'fixed', inset: 0, zIndex: 50,
              background: 'rgba(3,8,15,0.7)', backdropFilter: 'blur(4px)',
            }} />

            style={{
              position: 'fixed', zIndex: 51,
              top: '50%', left: '50%',

              maxHeight: 'calc(100vh - 64px)',
              display: 'flex', flexDirection: 'column',
              background: C.panelSolid,
              border: `1px solid ${accent}`,

              <div style={{
                width: 48, height: 48, borderRadius: 10,
                background: `${accent}22`, color: accent,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                boxShadow: `inset 0 0 12px ${accent}44, 0 0 18px ${accent}33`,
                flexShrink: 0,
              }}>
                <IcMapPin size={22} />

              <div style={{ flex: 1, minWidth: 0 }}>

                  fontFamily: "'IBM Plex Sans', sans-serif",

                <div style={{

                {/* type breakdown chips */}

                onMouseLeave={(e) => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = C.textMuted; }}>

                      <div style={{
                        fontFamily: "'IBM Plex Mono', monospace",

                        {m.label.toUpperCase()}
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </>
      );
    }

    /* ============================================================
       INFO CARD — opens when a pin is clicked
       ============================================================ */
    function AccountPanel({ account }) {
      if (!account) return null;
      const isE = account.accountType === 'Electric';
      const isG = account.accountType === 'Gas';
      const fuelColor = isE ? '#22c55e' : isG ? '#3B82F6' : '#64748b';
      const icon      = isE ? '⚡' : isG ? '🔥' : '◆';
      const label     = isE ? 'ELECTRIC' : isG ? 'GAS' : (account.accountType || 'ACCOUNT').toUpperCase();
      const usageUnit = isG ? 'therms' : 'kWh';

      // Status pill color
      const statusText = String(account.status || '');
      const isPart   = PARTICIPATING_RE.test(statusText);
      const isInelig = INELIGIBLE_RE.test(statusText);
      const stColor  = isPart ? '#add540' : isInelig ? '#64748b' : '#3B82F6';

      const F = ({ label: l, mono, children }) => (
        <div>
          <div style={{ color: C.textDim, fontSize: 9, letterSpacing: 1.5, marginBottom: 2 }}>{l}</div>
          <div style={{
            color: C.text,
            fontFamily: mono ? "'IBM Plex Mono', monospace" : "'IBM Plex Sans', sans-serif",
            fontSize: mono ? 12 : 13,
          }}>{children}</div>
        </div>
      );

      return (
        <div style={{
          borderLeft: '3px solid ' + fuelColor,
          background: fuelColor + '0d',
          borderRadius: '0 8px 8px 0',
          padding: '11px 14px 12px',
          display: 'flex', flexDirection: 'column', gap: 9,
        }}>

    function InfoCard({ asset, onClose, onUpdate, onRemove, fromCluster, onBack }) {
      const inIframe = (typeof window !== 'undefined') && (window.parent !== window);
      const [editing, setEditing] = useState(false);
      const [draft, setDraft] = useState(asset);

      // reset draft when a different asset is selected
      useEffect(() => { setDraft(asset); setEditing(false); }, [asset?.id]);

      // close on Escape
      useEffect(() => {
        const onKey = (e) => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [onClose]);

      if (!asset) return null;
      const meta = TYPE_META[asset.type];
      const Ico = meta.Icon;
      // Card glow color keyed to fuel mix: green=electric, blue=gas, teal=both.
      const _fuelMix = asset.fuelMix
                    || (asset.accountType === 'Electric' ? 'electric'
                      : asset.accountType === 'Gas'      ? 'gas' : 'none');
      const cardGlow = (FUEL_META[_fuelMix] && FUEL_META[_fuelMix].color) || meta.color;

      const save = () => {
        onUpdate(asset.id, {
          name: (draft.name || '').trim() || asset.name,
          company: (draft.company || '').trim(),
          address: (draft.address || '').trim(),
          notes: (draft.notes || '').trim(),

    /* ============================================================

    function STSAssetMap() {
      const mode = parseMode();
      const clientName = parseClientName();
      const [assets, setAssets] = useState(loadPortfolio);
      const [hoveredId, setHoveredId] = useState(null);
      const [selectedId, setSelectedId] = useState(null);
      const [selectedClusterKey, setSelectedClusterKey] = useState(null);
      const [filter, setFilter] = useState('all'); // legacy — unused since roster removed
      const [filters, setFilters] = useState({ q: '', state: 'all', type: 'all', status: 'all' });

      const stateOptions = useMemo(() => {
        const set = new Set();
        assets.forEach(a => { if (a.state) set.add(String(a.state).toUpperCase()); });
        return Array.from(set).sort();
      }, [assets]);

      // Aggregate ALL accounts into locations once (with full account lists)
      const allLocations = useMemo(() => aggregateLocations(assets), [assets]);

      // Filter at the LOCATION level so dual-fuel sites keep both accounts
      // visible in the InfoCard regardless of which fuel matched the filter.
      const filteredLocations = useMemo(() => {
        const q = (filters.q || '').toLowerCase().trim();
        return allLocations.filter(loc => {
          if (q) {
            const acctText = loc.accounts.map(a => [a.account, a.utility, a.supplier].filter(Boolean).join(' ')).join(' ');
            const hay = [loc.name, loc.address, loc.city, loc.state, loc.storeCode, acctText]
              .filter(Boolean).join(' ').toLowerCase();
            if (hay.indexOf(q) < 0) return false;
          }
          if (filters.state !== 'all' && String(loc.state || '').toUpperCase() !== filters.state) return false;
          if (filters.type === 'electric' && !loc.hasElectric) return false;
          if (filters.type === 'gas'      && !loc.hasGas)      return false;
          if (filters.status === 'participating' && loc.combinedStatus !== 'participating') return false;
          if (filters.status === 'eligible'      && loc.combinedStatus !== 'eligible')      return false;
          return true;
        });
      }, [allLocations, filters.q, filters.state, filters.type, filters.status]);

      // Legacy account-level filtered list (kept for any unconverted consumer)
      const filteredAssets = useMemo(() =>
        filteredLocations.flatMap(l => l.accounts || []),
        [filteredLocations]
      );

      useEffect(() => { persistPortfolio(assets); }, [assets]);

      useEffect(() => {
        const onStorage = (e) => {
          if (e.key === PORTFOLIO_STORAGE_KEY) {
            setAssets(loadPortfolio());
          }
        };
        window.addEventListener('storage', onStorage);
        return () => window.removeEventListener('storage', onStorage);
      }, []);

      useEffect(() => {
        const fresh = assets.find(a => a._fresh);
        if (!fresh) return;
        const t = setTimeout(() => {
          setAssets(curr => curr.map(a => a._fresh ? { ...a, _fresh: false } : a));
        }, 2200);
        return () => clearTimeout(t);
      }, [assets]);

      const addAsset = (a) => setAssets(curr => [...curr, a]);
      const removeAsset = (id) => {
        setAssets(curr => curr.filter(a => a.id !== id));
        if (selectedId === id) setSelectedId(null);
      };
      const updateAsset = (id, patch) => setAssets(curr => curr.map(a => a.id === id ? { ...a, ...patch } : a));
      const selectedAsset = useMemo(() => {
        if (!selectedId) return null;
        // Prefer location lookup (combined record with all accounts at that address)
        const loc = allLocations.find(l => l.id === selectedId);
        if (loc) return loc;
        // Fall back to legacy account-level lookup
        return assets.find(a => a.id === selectedId) || null;
      }, [assets, allLocations, selectedId]);

      // cluster the user is currently viewing (or came from)
      const viewCluster = useMemo(() => {
        if (!selectedClusterKey) return null;
        const [city, state] = selectedClusterKey.split('|');
        const clusterAssets = assets.filter(a => a.city === city && a.state === state);
        if (!clusterAssets.length) return null;
        return { key: selectedClusterKey, city, state, assets: clusterAssets };
      }, [selectedClusterKey, assets]);

      // When InfoCard or ClusterList opens, ask the parent page to scroll this
      // iframe into view. position:fixed inside an iframe centers within the
      // iframe's own viewport — if the parent has the iframe partially scrolled
      // off-screen, the modal can render below the visible area. The parent
      // listens for this message and runs scrollIntoView.
      useEffect(() => {
        if (!(selectedAsset || viewCluster)) return;
        try { window.parent && window.parent.postMessage({ type: 'sts-modal-open' }, '*'); } catch (e) {}
      }, [selectedAsset, viewCluster]);

      const counts = useMemo(() => ({
        employee:   assets.filter(a => a.type === 'other').length,
        partner:    assets.filter(a => a.type === 'contracted').length,
        contractor: assets.filter(a => a.type === 'eligible').length,
      }), [assets]);

      return (
        <div className="min-h-screen w-full"
          style={{
            background: `linear-gradient(180deg, ${C.bg} 0%, #03080F 100%)`,
            color: C.text, fontFamily: "'IBM Plex Sans', system-ui, sans-serif",
          }}>
          <div className="mx-auto px-6 py-3 grid grid-cols-1 gap-6" style={{ maxWidth: 1800 }}>
            <div className="rounded-2xl overflow-hidden relative"
              style={{ background: C.panelSolid, border: `1px solid ${C.border}` }}>
              <div className="absolute top-0 left-0 right-0 overflow-hidden" style={{ pointerEvents: 'none', height: 1 }}>
                <div style={{ height: 1, width: '100%',
                  background: `linear-gradient(90deg, transparent, ${C.accent}55, transparent)` }} />
              </div>
              <USMap assets={filteredLocations} hoveredId={hoveredId} setHoveredId={setHoveredId}
                selectedId={selectedId} setSelectedId={setSelectedId}
                selectedClusterKey={selectedClusterKey} setSelectedClusterKey={setSelectedClusterKey} />
              <div className="md:hidden px-4 py-3 flex items-center justify-around border-t" style={{ borderColor: C.border }}>
                {Object.entries(TYPE_META).map(([k, meta]) => (
                  <div key={k} className="flex items-center gap-1.5">
                    <span className="inline-block rounded-full" style={{ width: 8, height: 8, background: meta.color, boxShadow: `0 0 10px ${meta.color}` }} />
                    <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 10, color: C.textMuted, letterSpacing: 1 }}>
                      {meta.label} <span style={{ color: C.text }}>{counts[k]}</span>
                    </span>
                  </div>
                ))}
              </div>
            </div>

            <aside className="space-y-3">
              <SearchFilterBar
                filters={filters}
                setFilters={setFilters}
                stateOptions={stateOptions}
                totalCount={allLocations.length}
                matchedCount={filteredLocations.length} />
              <MatchedLocationsList
                assets={filteredLocations}
                hoveredId={hoveredId}
                setHoveredId={setHoveredId}
                setSelectedId={setSelectedId}
                filters={filters}
                setFilters={setFilters}
                allLocations={allLocations}
                hasActiveFilters={!!filters.q || filters.state !== 'all' || filters.type !== 'all' || filters.status !== 'all'} />
              {mode === 'admin' && (
                <div className="rounded-2xl p-5" style={{ background: C.panelSolid, border: `1px solid ${C.border}` }}>
                  <AddAssetForm onAdd={addAsset} />
                </div>
              )}
            </aside>
          </div>

          <div className="mx-auto px-6 pb-8 flex items-center justify-between"
            style={{ maxWidth: 1800, fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 10, color: C.textDim, letterSpacing: 2 }}>
            <span>STS / ASSET-MAP / V2.0</span>
            <span>{new Date().toISOString().slice(0, 10).toUpperCase()} · {counts.employee + counts.partner + counts.contractor} TOTAL ASSETS</span>
          </div>

          {selectedAsset ? (
            <InfoCard
              asset={selectedAsset}
              fromCluster={viewCluster}
              onBack={viewCluster ? () => setSelectedId(null) : null}
              onClose={() => { setSelectedId(null); setSelectedClusterKey(null); }}
              onUpdate={updateAsset}
              onRemove={removeAsset} />
          ) : viewCluster ? (
            <ClusterList
              cluster={viewCluster}
              onSelectAsset={(id) => setSelectedId(id)}
              onClose={() => setSelectedClusterKey(null)} />
          ) : null}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<STSAssetMap />);
    requestAnimationFrame(() => {
      const b = document.getElementById('boot');
      if (b) { b.classList.add('gone'); setTimeout(() => b.remove(), 500); }
    });
  </script>
</body>
</html>
